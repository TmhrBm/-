<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>空間の内積・直交条件と垂線 ー 体験教材</title>
<style>
/* =========================================================================
   APP-COMMON-CSS-START
   ========================================================================= */
:root{
  --n-color:#1d4ed8;
  --n-bg:#e5edfc;
  --an-color:#0f7a3d;
  --an-bg:#e2f5e9;
  --rule-color:#be185d;
  --rule-bg:#fce7f3;
  --correct:#178a43;
  --correct-bg:#e5f7ec;
  --caution:#c65a12;
  --caution-bg:#fdf0e4;
  --bg:#f6f7fa;
  --card:#ffffff;
  --border:#dfe3ea;
  --text:#20242c;
  --text-soft:#666f7d;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  line-height:1.75;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:840px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, input:focus-visible{outline:3px solid #93b4f7;outline-offset:2px;}
input[type=number]{font-family:inherit;font-size:1.05em;}
#app-header{
  padding:14px 18px 10px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
}
.header-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.82em;color:var(--text-soft);margin:0 0 8px;letter-spacing:.02em;}
.header-title .ht-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lap-badge{background:var(--an-bg);color:var(--an-color);border-radius:999px;padding:2px 10px;font-size:.9em;font-weight:700;white-space:nowrap;flex:0 0 auto;}
.stage-dots{display:flex;align-items:center;gap:6px;}
.stage-dot{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:.72em;color:var(--text-soft);
}
.stage-dot .dot{
  width:26px;height:26px;border-radius:50%;
  background:#eceff3;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.9em;color:var(--text-soft);
  transition:all .2s;
}
.stage-dot.active .dot{background:var(--n-color);border-color:var(--n-color);color:#fff;}
.stage-dot.done .dot{background:var(--an-bg);border-color:var(--an-color);color:var(--an-color);}
.stage-dot.active{color:var(--n-color);font-weight:700;}
.stage-sub{font-size:.78em;color:var(--text-soft);margin-top:6px;}
#app-main{flex:1;padding:18px 18px 30px;}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:16px;
}
h2.stage-title{font-size:1.25em;margin:0 0 6px;}
p.stage-goal{color:var(--text-soft);font-size:.92em;margin:0 0 14px;}
p.lead{margin:0 0 12px;font-size:.97em;}
.small-note{font-size:.85em;color:var(--text-soft);margin-top:8px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:999px;font-size:.88em;font-weight:700;
}
.chip-n{background:var(--n-bg);color:var(--n-color);}
.chip-an{background:var(--an-bg);color:var(--an-color);}
.chip-rule{background:var(--rule-bg);color:var(--rule-color);}
.seq-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:14px 0;}
.term-card{
  border:2px solid var(--border);background:var(--card);
  border-radius:10px;padding:8px 4px 10px;min-width:58px;text-align:center;
  cursor:default;
}
.term-card .n-label{color:var(--n-color);font-size:.76em;font-weight:700;}
.term-card .val{font-size:1.25em;font-weight:800;color:var(--text);margin-top:2px;}
.term-card.dots{cursor:default;border-style:dashed;color:var(--text-soft);}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.btn{
  border:2px solid var(--border);background:#fff;color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:.95em;font-weight:700;
}
.btn:hover{border-color:var(--n-color);}
.btn.primary{background:var(--n-color);border-color:var(--n-color);color:#fff;}
.btn.primary:hover{background:#1a44b8;}
.btn.ghost{background:transparent;}
.btn.selected{border-color:var(--rule-color);background:var(--rule-bg);color:var(--rule-color);}
.btn.correct-ans{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:6px 12px;font-size:.85em;}
.btn.complete{background:var(--correct);border-color:var(--correct);color:#fff;}
.btn.complete:hover{background:#0f6b34;}
.btn.complete.done{background:var(--correct-bg);color:var(--correct);}
.feedback{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.94em;}
.feedback.ok{background:var(--correct-bg);color:var(--correct);border:1.5px solid var(--correct);}
.feedback.warn{background:var(--caution-bg);color:var(--caution);border:1.5px solid var(--caution);}
.feedback b{display:block;margin-bottom:2px;font-size:1.02em;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-size:.92em;line-height:1.15;}
.frac .num{padding:0 5px 2px;border-bottom:2px solid currentColor;}
.frac .den{padding:2px 5px 0;}
.math-lg{font-size:1.35em;font-weight:700;}
.fix-change{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;}
.fc-box{border-radius:10px;padding:10px;text-align:center;font-size:.85em;}
.fc-box .fc-label{font-weight:700;margin-bottom:4px;display:block;}
.fc-box.fixed{background:var(--rule-bg);color:var(--rule-color);}
.fc-box.change{background:var(--n-bg);color:var(--n-color);}
.fc-box.result{background:var(--an-bg);color:var(--an-color);}
.fc-box .fc-val{font-weight:800;font-size:1.1em;margin-top:2px;}
.step-flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0;}
.step-box{
  border:2px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;min-width:80px;background:#fff;
}
.step-box .step-label{font-size:.75em;color:var(--text-soft);margin-bottom:3px;}
.step-arrow{color:var(--text-soft);font-size:1.3em;}
.flow-vert{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.flow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.flow-arrow-down{color:var(--text-soft);font-size:1.2em;padding-left:6px;}
.flow-result{border:2px solid var(--rule-color);background:var(--rule-bg);border-radius:10px;padding:12px 16px;text-align:center;color:var(--rule-color);font-weight:800;}
.flow-badge{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.flow-badge .arrow{color:var(--text-soft);font-size:.9em;}
table.verify{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92em;}
table.verify th,table.verify td{border:1px solid var(--border);padding:7px 8px;text-align:center;}
table.verify th{background:#f2f4f8;color:var(--text-soft);font-weight:700;}
table.verify td.mark-ok{color:var(--correct);font-weight:800;}
table.verify td.mark-ng{color:var(--caution);font-weight:800;}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:.95em;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:19px;height:19px;accent-color:var(--an-color);}
.quiz-given{background:#f7f9fc;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;font-size:.92em;}
.quiz-q{font-weight:700;margin-bottom:10px;}
.quiz-options{display:flex;flex-wrap:wrap;gap:8px;}
#app-footer{
  position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);
  padding:12px 18px;display:flex;gap:10px;justify-content:space-between;
}
#app-footer .btn{flex:1;text-align:center;}
#app-footer .btn.restart{flex:0 0 auto;}
@media (max-width:520px){
  .fix-change{grid-template-columns:1fr;}
  #app-main{padding:14px 12px 24px;}
  .panel{padding:14px;}
  .stage-dot{font-size:.62em;}
  .stage-dot .dot{width:22px;height:22px;font-size:.8em;}
}
@media print{
  #app-footer, .btn, .quiz-options, input{display:none !important;}
  #app-header{position:static;}
  body{background:#fff;}
  .lap-badge{display:none !important;}
}
/* =========================================================================
   APP-COMMON-CSS-END
   ========================================================================= */
/* =========================================================================
   LESSON-SPECIFIC-CSS-START
   ベクトル教材固有：3D風（斜投影）の空間座標SVG。
   座標軸は教科書と同じ向き（z=上、y=右、x=手前の左下）にし、
   矢印（ベクトル）と軸が重ならないようにしている。
   ========================================================================= */
.vec-svg-wrap{display:flex;justify-content:center;margin:14px 0 6px;}
.vec-svg{width:100%;max-width:400px;height:auto;background:#fbfcfe;border:1px solid var(--border);border-radius:10px;}
/* 軸は細く薄く（ベクトルより目立たせない） */
.vec-svg .axis3d{stroke:#c3cad6;stroke-width:1.2;}
.vec-svg .axis-label{fill:var(--text-soft);font-size:12px;font-weight:800;paint-order:stroke;stroke:#fbfcfe;stroke-width:3px;stroke-linejoin:round;}
.vec-svg .depth-line{stroke:var(--text-soft);stroke-width:1.2;stroke-dasharray:4 3;}
.vec-svg .depth-label{fill:var(--text-soft);font-size:11px;font-weight:700;paint-order:stroke;stroke:#fbfcfe;stroke-width:3px;stroke-linejoin:round;}
.vec-svg .vlabel{font-size:14px;font-weight:800;paint-order:stroke;stroke:#fbfcfe;stroke-width:3.5px;stroke-linejoin:round;}
.vec-svg .vlabel.blue{fill:var(--n-color);}
.vec-svg .vlabel.green{fill:var(--an-color);}
.vec-svg .vlabel.purple{fill:var(--rule-color);}
.vec-svg .pt-dot{fill:var(--n-color);}
.vec-svg .pt-dot.green{fill:var(--an-color);}
.vec-svg .pt-dot.purple{fill:var(--rule-color);}
.vec-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px;font-size:.82em;}
.vec-legend .lg{display:inline-flex;align-items:center;gap:5px;font-weight:700;}
.vec-legend .swatch{width:22px;height:0;border-top:3px solid;border-radius:2px;}
.vec-legend .lg.blue{color:var(--n-color);}
.vec-legend .lg.green{color:var(--an-color);}
.vec-legend .lg.purple{color:var(--rule-color);}
.vec-legend .lg.gray{color:var(--text-soft);}
.vec-legend .lg.gray .swatch{border-top-width:2px;}
/* 切り替え操作の状態表示（何回切り替えたか・今どちらの状態か） */
.toggle-state{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.85em;color:var(--text-soft);}
.toggle-state .now{background:var(--n-bg);color:var(--n-color);border-radius:999px;padding:2px 10px;font-weight:700;}
table.terms{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92em;}
table.terms th,table.terms td{border:1px solid var(--border);padding:8px;text-align:center;}
table.terms th{background:#f2f4f8;color:var(--text-soft);font-weight:700;}
table.terms td.hl{color:var(--rule-color);font-weight:800;}
/* =========================================================================
   LESSON-SPECIFIC-CSS-END
   ========================================================================= */
</style>
</head>
<body>
<div id="app">
  <header id="app-header"></header>
  <main id="app-main"></main>
  <footer id="app-footer"></footer>
</div>
<script>
'use strict';
/* =========================================================================
   LESSON-SPECIFIC-DATA-START
   ========================================================================= */
var LESSON_ID = '10';
var TEXTBOOK_REF = '教科書 p.58〜60・p.66（空間の内積・直交条件・垂線）';
var CHART_REF = '黄チャート p.573〜574・p.578〜579・p.595・p.599（基本事項・基本例題）';
var STEPS = ['s1', 's2', 's3', 's4', 'summary'];
var STAGE_LABEL = { s1:'ステージ1', s2:'ステージ2', s3:'ステージ3', s4:'ステージ4', summary:'まとめ' };
var STAGE_SUBLABEL = {
  s1:'空間の内積とは',
  s2:'垂直かどうかを見分ける',
  s3:'内積の性質を確かめる',
  s4:'垂線の足という考え方',
  summary:'今日の理解を確認する'
};
var DOT_INDEX = { s1:0, s2:1, s3:2, s4:3, summary:4 };
var DOT_LABELS = ['1', '2', '3', '4', 'まとめ'];
function flowBadgeInner(){
  return '<span class="chip chip-n">2本のベクトル</span><span class="arrow">→</span>'
       + '<span class="chip chip-an">成分で計算</span><span class="arrow">→</span>'
       + '<span class="chip chip-rule">垂直条件</span>';
}
function newQuizState(){ return { qid:null, selected:null, answered:false, attempts:0, showAnswer:false }; }
/* s1〜s4共通のベクトル。a=(2,0,3)は固定の基準ベクトル。
   Bperp=(0,4,0)はaと垂直（a・Bperp=0）、Boblique=(3,4,0)は垂直でない（a・Boblique=6）。 */
var IP_A = [2, 0, 3];
var IP_C = [0, 3, 2];
var IP_BPERP = [0, 4, 0];
var IP_BOBLIQUE = [3, 4, 0];
function s1QuizPool(){
  return [
    { id:'formula-def', ask:'空間ベクトルの内積は、成分を使ってどう計算しますか。',
      correct:'a·b=a₁b₁+a₂b₂+a₃b₃', options:['a·b=a₁b₁+a₂b₂+a₃b₃','a·b=a₁b₁+a₂b₂','a·b=(a₁+b₁)+(a₂+b₂)+(a₃+b₃)'],
      hints:['05で学んだ平面の内積 a·b=a₁b₁+a₂b₂ に、z成分を1つ足すだけです。',
        '対応する成分どうしをかけて、3つとも足し合わせます。'],
      reason:'空間の内積は a·b=a₁b₁+a₂b₂+a₃b₃ です。平面の式にz成分の積を1つ足しただけで、考え方は変わりません。' },
    { id:'compute-ac', ask:'a=(2, 0, 3)、c=(0, 3, 2) のとき、a·c はいくつですか。',
      correct:'6', options:['5','6','9'],
      hints:['a·c=2×0+0×3+3×2 を計算しましょう。',
        '0+0+6を計算します。'],
      reason:'a·c=2×0+0×3+3×2=0+0+6=6 です。' },
    { id:'scalar-result', ask:'空間の内積 a·b の計算結果は、どんな種類の量ですか。',
      correct:'数（スカラー）', options:['ベクトル','空間の点','数（スカラー）'],
      hints:['05で学んだ平面の内積と同じ性質です。',
        '矢印ではなく、ただの数になります。'],
      reason:'空間でも内積の結果は、向きを持たない「数（スカラー）」です。ベクトルにはなりません（05の内積と同じ性質です）。' }
  ];
}
var S2_MC_OPTIONS = ['0になる', '正の数になる', '負の数になる'];
var S2_MC_CORRECT = '0になる';
function s2QuizPool(){
  return [
    { id:'perp-check1', ask:'a=(2, 0, 3)、b=(0, 4, 0) のとき、a·b はいくつですか。垂直と言えますか。',
      correct:'0、垂直と言える', options:['6、垂直ではない','0、垂直と言える','12、垂直ではない'],
      hints:['a·b=2×0+0×4+3×0 を計算しましょう。',
        '内積が0になれば垂直です。'],
      reason:'a·b=2×0+0×4+3×0=0 なので、a と b は垂直です。' },
    { id:'oblique-check', ask:'a=(2, 0, 3)、b=(3, 4, 0) のとき、a·b はいくつですか。垂直と言えますか。',
      correct:'6、垂直ではない', options:['0、垂直と言える','9、垂直ではない','6、垂直ではない'],
      hints:['a·b=2×3+0×4+3×0 を計算しましょう。',
        '内積が0でなければ垂直ではありません。'],
      reason:'a·b=2×3+0×4+3×0=6+0+0=6 で0ではないので、a と b は垂直ではありません。' },
    { id:'misconception', ask:'a=(2, 0, 3)、b=(3, 4, 0) です。「bのz成分が0だから、bはaに垂直だ」と判断してよいですか。',
      correct:'よくない（a·bを計算すると6で、垂直ではない）',
      options:['よくない（a·bを計算すると6で、垂直ではない）','よい（z成分が0なら必ず垂直）','aの大きさが分かれば判断できる'],
      hints:['片方のベクトルの成分だけを見ても、相手との垂直は判断できません。',
        'a·b=2×3+0×4+3×0 を実際に計算してみましょう。'],
      reason:'a·b=2×3+0×4+3×0=6 で0ではないので、aとbは垂直ではありません。垂直かどうかは、必ず「相手のベクトルを決めて」内積を計算して判断します。片方の成分が0であることだけを根拠にしてはいけません。' }
  ];
}
function s3QuizPool(){
  return [
    { id:'self-dot', ask:'空間ベクトルaについて、a·a はどんな式と同じになりますか。',
      correct:'|a|²', options:['|a|','|a|²','3|a|'],
      hints:['05で学んだ平面のa·aと同じ考え方です。',
        'a·a=a₁²+a₂²+a₃²=|a|² になります。'],
      reason:'a·a=a₁²+a₂²+a₃²=|a|² です。自分自身との内積は大きさの2乗になります（05と同じ性質）。' },
    { id:'commute-space', ask:'空間でも a·b と b·a の関係はどうなりますか。',
      correct:'常に等しい', options:['符号が逆になる','関係ない','常に等しい'],
      hints:['成分での計算式 a₁b₁+a₂b₂+a₃b₃ と b₁a₁+b₂a₂+b₃a₃ を見比べましょう。',
        'かけ算の順番を入れかえても積は変わりません。'],
      reason:'a·b=a₁b₁+a₂b₂+a₃b₃、b·a=b₁a₁+b₂a₂+b₃a₃ で、かけ算の順番が違うだけなので常に等しくなります（05の平面の内積と同じ交換法則）。' },
    { id:'compute-oblique', ask:'a=(2, 0, 3)、b=(3, 4, 0) のとき、a·b の値を使って、aとbは垂直と言えますか。',
      correct:'言えない（a·b=6で0でないため）', options:['言える（a·b=0のため）','関係ない','言えない（a·b=6で0でないため）'],
      hints:['a·bをもう一度計算してみましょう。',
        '0でなければ垂直ではありません。'],
      reason:'a·b=2×3+0×4+3×0=6 で0ではないため、aとbは垂直ではありません。' }
  ];
}
function s4QuizPool(){
  return [
    { id:'foot-def', ask:'点Qから直線へ下ろした垂線の足Hは、どんな条件を満たす点ですか。',
      correct:'QH↑が直線の方向ベクトルと垂直（内積が0）になる点',
      options:['直線上でQに最も近い、Oと一致する点','QH↑が直線の方向ベクトルと垂直（内積が0）になる点','QH↑の大きさが最大になる点'],
      hints:['「垂線」という名前の通り、垂直な関係を使います。',
        'QH↑と直線の方向ベクトルの内積が0になる点が、垂線の足です。'],
      reason:'垂線の足Hは、QH↑と直線の方向ベクトルの内積が0（垂直）になる点として求められます。' },
    { id:'foot-check', ask:'QH↑=(−2, 0, −3)、直線の方向ベクトルd=(0, 1, 0) のとき、QH↑とdは垂直と言えますか。',
      correct:'言える（QH↑・d=0）', options:['言えない（QH↑・d=−3）','情報が足りない','言える（QH↑・d=0）'],
      hints:['QH↑・d=(−2)×0+0×1+(−3)×0 を計算しましょう。',
        '0になれば垂直です。'],
      reason:'QH↑・d=(−2)×0+0×1+(−3)×0=0 なので、QH↑とdは垂直です。Hは垂線の足であることが確かめられます。' },
    { id:'foot-purpose', ask:'垂線の足を求める考え方は、何に役立ちますか。',
      correct:'点と直線（や平面）との距離や、最も近い点を求めること',
      options:['点と直線（や平面）との距離や、最も近い点を求めること','ベクトルの大きさを2倍にすること','2つのベクトルを足し合わせること'],
      hints:['垂線の足Hは、直線上でQに最も近い点になります。',
        '距離を求めるときの土台になる考え方です。'],

function frac(numHtml, denHtml){
  return '<span class="frac"><span class="num">'+numHtml+'</span><span class="den">'+denHtml+'</span></span>';
}
function fmtNum(x){
  if (typeof x === 'object' && x !== null && 'num' in x && 'den' in x) return frac(x.num, x.den);
  return String(x);
}
function escAttr(s){ return String(s).replace(/"/g,'&quot;'); }
function numOptions(correct, deltas){
  var set = [correct];
  deltas.forEach(function(d){
    var v = correct + d;
    if (v !== correct && set.indexOf(v) === -1) set.push(v);
  });
  set = set.slice(0,4);
  set.sort(function(a,b){ return a-b; });
  return set;
}
/* 周回数の記録。ベクトル版はキー接頭辞を変更（数列と混ざらないように） */
var LAP_KEY_PREFIX = 'vector:lap:';
function lapStorageKey(){
  return LAP_KEY_PREFIX + (typeof LESSON_ID !== 'undefined' ? LESSON_ID : 'unknown');
}
function lapStorageAvailable(){
  try { return typeof localStorage !== 'undefined' && localStorage !== null; }
  catch(e){ return false; }
}
function readLapCount(){
  if (!lapStorageAvailable()) return 0;
  try {
    var v = parseInt(localStorage.getItem(lapStorageKey()), 10);
    return (isFinite(v) && v > 0) ? v : 0;
  } catch(e){ return 0; }
}
function writeLapCount(n){
  if (!lapStorageAvailable()) return n;
  try { localStorage.setItem(lapStorageKey(), String(n)); } catch(e){}
  return n;
}
function incrementLapCount(){
  var n = readLapCount() + 1;
  writeLapCount(n);
  return n;
}

function pickQuestion(pool, avoidId){
  var candidates = pool;
  if (pool.length > 1 && avoidId){
    candidates = pool.filter(function(q){ return q.id !== avoidId; });
  }
  return candidates[Math.floor(Math.random()*candidates.length)];
}
function renderQuizBlock(pool, qState, answerAction, nextAction){
  var q = pool.filter(function(p){ return p.id === qState.qid; })[0];
  if (!q){ q = pickQuestion(pool, null); qState.qid = q.id; }
  var base = answerAction.replace(/-answer$/, '');
  var solved = qState.answered && qState.selected === q.correct;
  var locked = solved || qState.showAnswer;
  var html = '';
  if (q.given) html += '<div class="quiz-given">'+q.given+'</div>';
  html += '<div class="quiz-q">Q. '+q.ask+'</div>';
  html += '<div class="quiz-options">';
  q.options.forEach(function(opt){
    var cls = 'btn sm';
    if (locked){
      if (opt === q.correct) cls += ' correct-ans';
      else if (opt === qState.selected) cls += ' selected';
    } else if (qState.answered && opt === qState.selected){
      cls += ' selected';
    }
    html += '<button class="'+cls+'" data-action="'+answerAction+'" data-value="'+escAttr(opt)+'" '+(qState.answered?'disabled':'')+'>'+opt+'</button>';
  });
  html += '</div>';
  if (solved){
    html += '<div class="feedback ok"><b>正解です。</b>'+q.reason+'</div>';
    html += '<div class="btn-row"><button class="btn" data-action="'+nextAction+'">別の問題にする</button></div>';
  } else if (qState.showAnswer){
    html += '<div class="feedback warn"><b>考え方を確認しましょう。</b>'+q.reason+'</div>';
    html += '<div class="btn-row"><button class="btn" data-action="'+nextAction+'">別の問題にする</button></div>';
  } else if (qState.answered){
    var attempts = qState.attempts || 1;
    var hints = q.hints || [];
    var hint = hints[Math.min(attempts-1, hints.length-1)] || 'もう一度、問題文と選択肢を見比べてみましょう。';
    html += '<div class="feedback warn"><b>答えと考え方を確認しましょう。</b>'+hint+'</div>';
    html += '<div class="btn-row"><button class="btn" data-action="'+base+'-retry">もう一度考える</button>';
    if (attempts >= 2){
      html += '<button class="btn ghost" data-action="'+base+'-reveal">考え方を確認する</button>';
    }
    html += '</div>';
  }
  return html;
}
function mcDone(sub, key, correct){
  return (sub[key+'Answered'] && sub[key+'Selected'] === correct) || sub[key+'ShowAnswer'];
}
function mcFeedback(sub, key, correct, hints, correctReason, actionBase){
  if (!sub[key+'Answered']) return '';
  var html = '';
  if (sub[key+'Selected'] === correct){
    html += '<div class="feedback ok"><b>その通りです。</b>'+correctReason+'</div>';
  } else if (sub[key+'ShowAnswer']){
    html += '<div class="feedback warn"><b>考え方を確認しましょう。</b>'+correctReason+'</div>';
  } else {
    var attempts = sub[key+'Attempts'] || 1;
    var hint = hints[Math.min(attempts-1, hints.length-1)];
    html += '<div class="feedback warn"><b>答えと考え方を確認しましょう。</b>'+hint+'</div>';
    html += '<div class="btn-row"><button class="btn" data-action="'+actionBase+'-retry">もう一度考える</button>';
    if (attempts >= 2){
      html += '<button class="btn ghost" data-action="'+actionBase+'-reveal">考え方を確認する</button>';
    }
    html += '</div>';
  }
  return html;
}
function mcAnswer(sub, key, correct, val){
  sub[key+'Selected'] = val; sub[key+'Answered'] = true;
  if (val !== correct) sub[key+'Attempts'] = (sub[key+'Attempts']||0) + 1;
}
function mcRetry(sub, key){ sub[key+'Answered'] = false; sub[key+'Selected'] = null; }
function mcReveal(sub, key){ sub[key+'Answered'] = true; sub[key+'ShowAnswer'] = true; }
function handleQuizAnswer(sub, pool, val){
  var q = pool.filter(function(p){ return p.id === sub.quiz.qid; })[0];
  sub.quiz.selected = val; sub.quiz.answered = true;
  if (!q || val !== q.correct) sub.quiz.attempts = (sub.quiz.attempts||0) + 1;
  render();
}
function handleQuizRetry(sub){ sub.quiz.answered = false; sub.quiz.selected = null; render(); }
function handleQuizReveal(sub){ sub.quiz.answered = true; sub.quiz.showAnswer = true; render(); }
function handleQuizNext(sub, pool){
  var q = pickQuestion(pool, sub.quiz.qid);

  render();
}
function renderHeader(){
  var key = STEPS[state.stepIndex];
  var activeDot = DOT_INDEX[key];
  var dotsHtml = '';
  for (var i=0;i<DOT_LABELS.length;i++){
    var cls = 'stage-dot' + (i===activeDot?' active':'') + (i<activeDot?' done':'');
    dotsHtml += '<div class="'+cls+'"><div class="dot">'+DOT_LABELS[i]+'</div></div>';
  }
  var lapText = lessonCompleted ? (lapCount+'周目 完了') : ((lapCount+1)+'周目');
  var html = '<p class="header-title"><span class="ht-text">'+document.title+'</span><span class="lap-badge">'+lapText+'</span></p>';
  html += '<div class="stage-dots">'+dotsHtml+'</div>';

  document.getElementById('app-header').innerHTML = html;

function summaryAllChecked(){
  var cl = state.summary && state.summary.checklist;
  return !!(cl && cl.length && cl.every(function(v){ return v === true; }));
}
function renderFooter(){
  var isFirst = state.stepIndex === 0;
  var isLast = state.stepIndex === STEPS.length-1;
  var html = '';
  html += '<button class="btn ghost" data-action="prev" '+(isFirst?'disabled':'')+'>← 前へ</button>';
  html += '<button class="btn restart" data-action="restart">最初から</button>';
  if (isLast){
    var ready = summaryAllChecked() && !lessonCompleted;
    html += '<button class="btn complete'+(lessonCompleted?' done':'')+'" data-action="complete" '+(ready?'':'disabled')+'>'+(lessonCompleted?'完了しました':'完了')+'</button>';
  } else {
    html += '<button class="btn primary" data-action="next">次へ →</button>';
  }
  document.getElementById('app-footer').innerHTML = html;
}
function handleComplete(){
  if (lessonCompleted || !summaryAllChecked()) return;
  lessonCompleted = true;
  lapCount = incrementLapCount();
  render();

function render(){
  renderHeader();
  var key = STEPS[state.stepIndex];
  var main = document.getElementById('app-main');

  if (state.navMsg){
    html += '<div class="panel"><div class="feedback warn"><b>'+state.navMsg+'</b></div></div>';

function goPrev(){ if (state.stepIndex > 0){ state.stepIndex--; render(); window.scrollTo(0,0); } }
function restartAll(){ state = initialState(); lessonCompleted = false; render(); window.scrollTo(0,0); }

/* =========================================================================
   LESSON-SPECIFIC-RENDERERS-START
   空間座標を斜投影で描く。軸の向きは教科書と同じ：
     z軸＝真上、y軸＝右、x軸＝手前（左下）。
   図は大きめ（1目盛り32px）にして矢印の線分を長くし、
   矢印の先端は線の太さに関係なく一定サイズ（12px）にして、
   線分と先端の大きさのバランスをとっている。
   ========================================================================= */
var SVG_W = 360, SVG_H = 260;
var P_OX = 100, P_OY = 200, P_S = 32;
var P_DQ = P_S * 0.42 * 0.7071; /* x（手前方向）1単位あたりの画面オフセット */
var SVG_COLORS = { blue:'var(--n-color)', green:'var(--an-color)', purple:'var(--rule-color)', gray:'#c3cad6' };
/* 空間座標(x,y,z)→画面座標[X,Y]。x は左下へ、y は右へ、z は上へ。 */
function proj(x,y,z){
  var X = P_OX - x*P_DQ + y*P_S;
  var Y = P_OY + x*P_DQ - z*P_S;
  return [X, Y];
}
/* 矢印の先端。markerUnits="userSpaceOnUse" にして、線の太さで拡大されないようにする。
   これを付けないと、線の太さの倍率で先端が拡大され、短い矢印では
   先端だけが大きく見えてしまう。軸用（gray）はさらに小さくする。 */
function svgMarkers(idp){
  var m = '';
  ['blue','green','purple'].forEach(function(c){
    m += '<marker id="'+idp+'-'+c+'" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">'
       + '<path d="M0,0 L12,6 L0,12 z" fill="'+SVG_COLORS[c]+'"/></marker>';
  });
  m += '<marker id="'+idp+'-gray" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">'
     + '<path d="M0,0 L8,4 L0,8 z" fill="'+SVG_COLORS.gray+'"/></marker>';
  return m;
}
/* 3本の座標軸を描く（細く薄い線。ベクトルより目立たせない） */
function draw3DAxes(idp){
  var o = proj(0,0,0);
  var ax = proj(4.4,0,0), ay = proj(0,5.4,0), az = proj(0,0,4.4);
  var s = '';
  s += '<line class="axis3d" x1="'+o[0]+'" y1="'+o[1]+'" x2="'+ax[0]+'" y2="'+ax[1]+'" marker-end="url(#'+idp+'-gray)"/>';
  s += '<line class="axis3d" x1="'+o[0]+'" y1="'+o[1]+'" x2="'+ay[0]+'" y2="'+ay[1]+'" marker-end="url(#'+idp+'-gray)"/>';
  s += '<line class="axis3d" x1="'+o[0]+'" y1="'+o[1]+'" x2="'+az[0]+'" y2="'+az[1]+'" marker-end="url(#'+idp+'-gray)"/>';
  s += '<text class="axis-label" x="'+(ax[0]-12)+'" y="'+(ax[1]+10)+'">x</text>';
  s += '<text class="axis-label" x="'+(ay[0]+7)+'" y="'+(ay[1]+5)+'">y</text>';
  s += '<text class="axis-label" x="'+(az[0]-4)+'" y="'+(az[1]-8)+'">z</text>';
  s += '<text class="axis-label" x="'+(o[0]+5)+'" y="'+(o[1]+16)+'">O</text>';
  return s;
}
/* 空間の矢印。from,to は [x,y,z]。ラベルは線に垂直14pxずらし＋白フチ。 */
function arrow3D(idp, color, from, to, label, side){
  var p1 = proj(from[0],from[1],from[2]), p2 = proj(to[0],to[1],to[2]);
  var x1=p1[0],y1=p1[1],x2=p2[0],y2=p2[1];
  var s = '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+SVG_COLORS[color]+'" stroke-width="2.8" stroke-linecap="round" marker-end="url(#'+idp+'-'+color+')"/>';
  if (label){
    var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy)||1;
    var px=-dy/L, py=dx/L;
    if (px>0){ px=-px; py=-py; }
    if (side === -1){ px=-px; py=-py; }
    var lx=(x1+x2)/2+px*18, ly=(y1+y2)/2+py*18+5;
    s += '<text class="vlabel '+color+'" x="'+lx+'" y="'+ly+'" text-anchor="middle">'+label+'</text>';
  }
  return s;
}
/* 点(x,y,z)への分解（O→x方向→y方向→z方向）を点線で示す */
function decompLines(x,y,z){
  var o=proj(0,0,0), a=proj(x,0,0), b=proj(x,y,0), c=proj(x,y,z);
  var s='';
  s+='<line class="depth-line" x1="'+o[0]+'" y1="'+o[1]+'" x2="'+a[0]+'" y2="'+a[1]+'"/>';
  s+='<line class="depth-line" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>';
  s+='<line class="depth-line" x1="'+b[0]+'" y1="'+b[1]+'" x2="'+c[0]+'" y2="'+c[1]+'"/>';
  s+='<text class="depth-label" x="'+((o[0]+a[0])/2-16)+'" y="'+((o[1]+a[1])/2+4)+'">x='+x+'</text>';
  s+='<text class="depth-label" x="'+((a[0]+b[0])/2)+'" y="'+((a[1]+b[1])/2+16)+'" text-anchor="middle">y='+y+'</text>';
  s+='<text class="depth-label" x="'+((b[0]+c[0])/2+9)+'" y="'+((b[1]+c[1])/2+4)+'">z='+z+'</text>';
  return s;
}
/* 点を打つ。dir でラベルを出す向きを選べる（矢印と重ならない側へ逃がすため）。
   'rt'=右上（既定）／'lb'=左下／'lt'=左上／'rb'=右下 */
function pointDot(x,y,z,label,dir,color){
  var p=proj(x,y,z);
  var c = color || 'blue';
  var s='<circle class="pt-dot'+(c==='green'?' green':'')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="4"/>';
  if(label){
    var ox=14, oy=-10, anchor='start';
    if(dir==='lb'){ ox=-13; oy=16; anchor='end'; }
    else if(dir==='lt'){ ox=-13; oy=-9; anchor='end'; }
    else if(dir==='rb'){ ox=14; oy=17; anchor='start'; }
    s+='<text class="vlabel '+c+'" x="'+(p[0]+ox)+'" y="'+(p[1]+oy)+'" text-anchor="'+anchor+'">'+label+'</text>';
  }
  return s;
}
function buildSvg3D(idp, inner){
  var s='<div class="vec-svg-wrap"><svg class="vec-svg" viewBox="0 0 '+SVG_W+' '+SVG_H+'" role="img">';
  s+='<defs>'+svgMarkers(idp)+'</defs>';
  s+=draw3DAxes(idp);
  s+=inner;
  s+='</svg></div>';
  return s;
}
function vecLegend(items){
  var s='<div class="vec-legend">';
  items.forEach(function(it){ s+='<span class="lg '+it.c+'"><span class="swatch" style="border-color:'+SVG_COLORS[it.c]+'"></span>'+it.t+'</span>'; });
  s+='</div>';
  return s;
}

/* ---- ステージ2：bを垂直⇄斜めで何度でも切り替えられる（中心発問） ----
   a=(2,0,3)は固定（青）。変わるのはb（緑）1本だけ（R4準拠）。 */
function renderStage2(){
  var s=state.s2;
  var html='';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title">垂直かどうかを見分ける</h2>';
  html+='  <p class="stage-goal">aは固定したまま、bの向きだけを「垂直」⇄「斜め」と切り替えます。そのときa·bの値がどう変わるか見ます。</p>';
  html+='  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  var b = s.bState === 'perp' ? IP_BPERP : IP_BOBLIQUE;
  var inner = arrow3D('s2','blue',[0,0,0],IP_A,'a')
            + arrow3D('s2','green',[0,0,0],b,'b',-1)
            + pointDot(IP_A[0],IP_A[1],IP_A[2],'A','rb','blue');
  html+=buildSvg3D('s2', inner);
  html+=vecLegend([{c:'blue',t:'a=(2, 0, 3)（固定）'},{c:'green', t: s.bState==='perp' ? 'b=(0, 4, 0)（垂直）' : 'b=(3, 4, 0)（斜め）'}]);
  if(s.bState==='perp'){
    html+='  <p class="lead">今はbが垂直な向きです。a·b=2×0+0×4+3×0=0 です。</p>';
  } else {
    html+='  <p class="lead">今はbが斜めの向きです。a·b=2×3+0×4+3×0=6 で、0ではありません。</p>';
  }
  html+='  <div class="btn-row">';
  html+='<button class="btn primary" data-action="s2-toggle-b">'
      + (s.bState==='perp' ? 'bを斜めに動かす' : 'bを垂直に戻す') + '</button>';
  html+='  </div>';
  html+='  <div class="toggle-state"><span class="now">今の状態：b='
      + (s.bState==='perp' ? '垂直' : '斜め') + '</span>'
      + '<span>切り替えた回数：'+s.bCount+' 回</span>'
      + '<span>何度でも切り替えて見比べられます。</span></div>';
  if(s.bEverOblique){
    html+='  <p class="lead" style="margin-top:14px;">Q. bが垂直のとき、a·bの値はどうなりますか。</p>';
    html+='  <div class="btn-row">';
    (function(){
      var locked=mcDone(s,'mc',S2_MC_CORRECT);
      S2_MC_OPTIONS.forEach(function(opt){
        var cls='btn';
        if(locked){ if(opt===S2_MC_CORRECT) cls+=' correct-ans'; else if(opt===s.mcSelected) cls+=' selected'; }
        else if(s.mcAnswered && opt===s.mcSelected){ cls+=' selected'; }
        html+='<button class="'+cls+'" data-action="s2-mc-answer" data-value="'+escAttr(opt)+'" '+(s.mcAnswered?'disabled':'')+'>'+opt+'</button>';
      });
    })();
    html+='  </div>';
    html+=mcFeedback(s,'mc',S2_MC_CORRECT,
      ['垂直のときと斜めのときで、a·bの値をそれぞれ計算して見比べましょう。',
       '垂直のときは2×0+0×4+3×0、斜めのときは2×3+0×4+3×0でした。'],
      'aとbが垂直のとき、a·b=0になります。斜めのときは0になりません。','s2-mc');
  }
  html+='</div>';
  if(s.bEverOblique && mcDone(s,'mc',S2_MC_CORRECT)){
    html+='<div class="panel">';
    html+='  <h2 class="stage-title" style="font-size:1.05em;">垂直条件のまとめ</h2>';
    html+='  <p class="lead">空間でも、内積が0かどうかで垂直を判定します。1つのベクトルの成分だけでは判断できません。</p>';
    html+='<div class="fix-change">';
    html+='  <div class="fc-box fixed"><span class="fc-label">垂直</span><div class="fc-val">a·b=0</div></div>';
    html+='  <div class="fc-box change"><span class="fc-label">垂直でない</span><div class="fc-val">a·b≠0</div></div>';
    html+='  <div class="fc-box result"><span class="fc-label">条件</span><div class="fc-val">a·b=a₁b₁+a₂b₂+a₃b₃=0</div></div>';
    html+='</div>';
    html+='</div>';
    html+='<div class="panel">';
    html+='  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
    html+=renderQuizBlock(s2QuizPool(), state.s2.quiz, 's2-quiz-answer', 's2-quiz-next');
    html+='</div>';
  }
  return html;
}

function renderStage3(){
  var html='';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title">内積の性質を確かめる</h2>';
  html+='  <p class="stage-goal">空間の内積も、05で学んだ平面の内積と同じ性質（交換法則・自分自身との内積）が成り立ちます。</p>';
  html+='  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  html+='<table class="terms"><tr><th>性質</th><th>式</th><th>意味</th></tr>';

  html+='<tr><td>交換法則</td><td>a·b=b·a</td><td>かける順を入れかえても同じ</td></tr>';
  html+='<tr><td>自分自身との内積</td><td>a·a=|a|²</td><td>大きさの2乗になる</td></tr>';
  html+='<tr><td>垂直条件</td><td class="hl">a·b=0 ⇔ a⊥b</td><td>内積が0なら垂直</td></tr>';
  html+='</table>';
  html+='  <p class="lead">たとえば a=(2, 0, 3)、b=(3, 4, 0) では a·b=6 で0ではないので、aとbは垂直ではありません。</p>';

  html+='<div class="panel">';

/* ---- ステージ4：垂線の足という考え方 ----
   直線として、すでに描かれているy軸をそのまま使う（d=(0,1,0)）。
   点Qから垂線の足Hへの矢印QH↑が、y軸と垂直（内積0）になることを示す。 */
function renderStage4(){
  var html='';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title">垂線の足という考え方</h2>';
  html+='  <p class="stage-goal">点Qから直線へ下ろした垂線の足Hは、「QH↑と直線の方向ベクトルの内積が0になる点」として求められます。ここではy軸を直線の例として使います。</p>';
  html+='  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  var Q=[2,2,3], H=[0,2,0];
  var inner = arrow3D('s4','blue',[0,0,0],Q,'q')
            + pointDot(Q[0],Q[1],Q[2],'Q','rt','blue')
            + pointDot(H[0],H[1],H[2],'H','rb','purple')
            + arrow3D('s4','purple',Q,H,'',-1);
  html+=buildSvg3D('s4', inner);
  html+=vecLegend([{c:'gray',t:'y軸（直線の例、方向ベクトル d=(0,1,0)）'},{c:'blue',t:'q=OQ↑=(2, 2, 3)'},{c:'purple',t:'垂線の足H(0, 2, 0)とQH↑'}]);
  html+='  <p class="lead">QH↑=(0−2, 2−2, 0−3)=(−2, 0, −3) です。QH↑・d=(−2)×0+0×1+(−3)×0=0 なので、QH↑はy軸（方向ベクトルd）と垂直です。これが「垂線の足」の意味です。</p>';
  html+='  <p class="small-note">実際にHの座標を求める計算（連立方程式）は黄チャートで練習します。ここでは「内積0で垂直を判定する」という考え方をつかみましょう。</p>';
  html+='</div>';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
  html+=renderQuizBlock(s4QuizPool(), state.s4.quiz, 's4-quiz-answer', 's4-quiz-next');
  html+='</div>';
  return html;
}

}
