<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>ベクトルの加法・減法 ー 体験教材</title>
<style>
/* =========================================================================
   APP-COMMON-CSS-START
   ========================================================================= */
:root{
  --n-color:#1d4ed8;
  --n-bg:#e5edfc;
  --an-color:#0f7a3d;
  --an-bg:#e2f5e9;
  --rule-color:#be185d;
  --rule-bg:#fce7f3;
  --correct:#178a43;
  --correct-bg:#e5f7ec;
  --caution:#c65a12;
  --caution-bg:#fdf0e4;
  --bg:#f6f7fa;
  --card:#ffffff;
  --border:#dfe3ea;
  --text:#20242c;
  --text-soft:#666f7d;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  line-height:1.75;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:840px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, input:focus-visible{outline:3px solid #93b4f7;outline-offset:2px;}
input[type=number]{font-family:inherit;font-size:1.05em;}
#app-header{
  padding:14px 18px 10px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
}
.header-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.82em;color:var(--text-soft);margin:0 0 8px;letter-spacing:.02em;}
.header-title .ht-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lap-badge{background:var(--an-bg);color:var(--an-color);border-radius:999px;padding:2px 10px;font-size:.9em;font-weight:700;white-space:nowrap;flex:0 0 auto;}
.stage-dots{display:flex;align-items:center;gap:6px;}
.stage-dot{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:.72em;color:var(--text-soft);
}
.stage-dot .dot{
  width:26px;height:26px;border-radius:50%;
  background:#eceff3;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.9em;color:var(--text-soft);
  transition:all .2s;
}
.stage-dot.active .dot{background:var(--n-color);border-color:var(--n-color);color:#fff;}
.stage-dot.done .dot{background:var(--an-bg);border-color:var(--an-color);color:var(--an-color);}
.stage-dot.active{color:var(--n-color);font-weight:700;}
.stage-sub{font-size:.78em;color:var(--text-soft);margin-top:6px;}
#app-main{flex:1;padding:18px 18px 30px;}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:16px;
}
h2.stage-title{font-size:1.25em;margin:0 0 6px;}
p.stage-goal{color:var(--text-soft);font-size:.92em;margin:0 0 14px;}
p.lead{margin:0 0 12px;font-size:.97em;}
.small-note{font-size:.85em;color:var(--text-soft);margin-top:8px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:999px;font-size:.88em;font-weight:700;
}
.chip-n{background:var(--n-bg);color:var(--n-color);}
.chip-an{background:var(--an-bg);color:var(--an-color);}
.chip-rule{background:var(--rule-bg);color:var(--rule-color);}
.seq-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:14px 0;}
.term-card{
  border:2px solid var(--border);background:var(--card);
  border-radius:10px;padding:8px 4px 10px;min-width:58px;text-align:center;
  cursor:default;
}
.term-card .n-label{color:var(--n-color);font-size:.76em;font-weight:700;}
.term-card .val{font-size:1.25em;font-weight:800;color:var(--text);margin-top:2px;}
.term-card.dots{cursor:default;border-style:dashed;color:var(--text-soft);}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.btn{
  border:2px solid var(--border);background:#fff;color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:.95em;font-weight:700;
}
.btn:hover{border-color:var(--n-color);}
.btn.primary{background:var(--n-color);border-color:var(--n-color);color:#fff;}
.btn.primary:hover{background:#1a44b8;}
.btn.ghost{background:transparent;}
.btn.selected{border-color:var(--rule-color);background:var(--rule-bg);color:var(--rule-color);}
.btn.correct-ans{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:6px 12px;font-size:.85em;}
.btn.complete{background:var(--correct);border-color:var(--correct);color:#fff;}
.btn.complete:hover{background:#0f6b34;}
.btn.complete.done{background:var(--correct-bg);color:var(--correct);}
.feedback{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.94em;}
.feedback.ok{background:var(--correct-bg);color:var(--correct);border:1.5px solid var(--correct);}
.feedback.warn{background:var(--caution-bg);color:var(--caution);border:1.5px solid var(--caution);}
.feedback b{display:block;margin-bottom:2px;font-size:1.02em;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-size:.92em;line-height:1.15;}
.frac .num{padding:0 5px 2px;border-bottom:2px solid currentColor;}
.frac .den{padding:2px 5px 0;}
.math-lg{font-size:1.35em;font-weight:700;}
.fix-change{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;}
.fc-box{border-radius:10px;padding:10px;text-align:center;font-size:.85em;}
.fc-box .fc-label{font-weight:700;margin-bottom:4px;display:block;}
.fc-box.fixed{background:var(--rule-bg);color:var(--rule-color);}
.fc-box.change{background:var(--n-bg);color:var(--n-color);}
.fc-box.result{background:var(--an-bg);color:var(--an-color);}
.fc-box .fc-val{font-weight:800;font-size:1.1em;margin-top:2px;}
.step-flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0;}
.step-box{
  border:2px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;min-width:80px;background:#fff;
}
.step-box .step-label{font-size:.75em;color:var(--text-soft);margin-bottom:3px;}
.step-arrow{color:var(--text-soft);font-size:1.3em;}
.flow-vert{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.flow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.flow-arrow-down{color:var(--text-soft);font-size:1.2em;padding-left:6px;}
.flow-result{border:2px solid var(--rule-color);background:var(--rule-bg);border-radius:10px;padding:12px 16px;text-align:center;color:var(--rule-color);font-weight:800;}
.flow-badge{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.flow-badge .arrow{color:var(--text-soft);font-size:.9em;}
table.verify{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92em;}
table.verify th,table.verify td{border:1px solid var(--border);padding:7px 8px;text-align:center;}
table.verify th{background:#f2f4f8;color:var(--text-soft);font-weight:700;}
table.verify td.mark-ok{color:var(--correct);font-weight:800;}
table.verify td.mark-ng{color:var(--caution);font-weight:800;}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:.95em;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:19px;height:19px;accent-color:var(--an-color);}
.quiz-given{background:#f7f9fc;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;font-size:.92em;}
.quiz-q{font-weight:700;margin-bottom:10px;}
.quiz-options{display:flex;flex-wrap:wrap;gap:8px;}
#app-footer{
  position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);
  padding:12px 18px;display:flex;gap:10px;justify-content:space-between;
}
#app-footer .btn{flex:1;text-align:center;}
#app-footer .btn.restart{flex:0 0 auto;}
@media (max-width:520px){
  .fix-change{grid-template-columns:1fr;}
  #app-main{padding:14px 12px 24px;}
  .panel{padding:14px;}
  .stage-dot{font-size:.62em;}
  .stage-dot .dot{width:22px;height:22px;font-size:.8em;}
}
@media print{
  #app-footer, .btn, .quiz-options, input{display:none !important;}
  #app-header{position:static;}
  body{background:#fff;}
  .lap-badge{display:none !important;}
}
/* =========================================================================
   APP-COMMON-CSS-END
   ========================================================================= */
/* =========================================================================
   LESSON-SPECIFIC-CSS-START
   ベクトル教材固有：矢印図SVG（.vec-svg）と用語対応表。
   ========================================================================= */
.vec-svg-wrap{display:flex;justify-content:center;margin:14px 0 6px;}
.vec-svg{width:100%;max-width:360px;height:auto;background:#fbfcfe;border:1px solid var(--border);border-radius:10px;}
.vec-svg .grid-line{stroke:#e3e7ee;stroke-width:1;}
.vec-svg .axis-line{stroke:#b7bfcc;stroke-width:1.5;}
.vec-svg .axis-label{fill:var(--text-soft);font-size:11px;font-weight:700;}
.vec-svg .vlabel{font-size:14px;font-weight:800;paint-order:stroke;stroke:#fbfcfe;stroke-width:3.5px;stroke-linejoin:round;}
.vec-svg .vlabel.blue{fill:var(--n-color);}
.vec-svg .vlabel.green{fill:var(--an-color);}
.vec-svg .vlabel.purple{fill:var(--rule-color);}
.vec-svg .helper-line{stroke:var(--text-soft);stroke-width:1.3;stroke-dasharray:4 3;}
.vec-svg .helper-label{fill:var(--text-soft);font-size:11px;font-weight:700;paint-order:stroke;stroke:#fbfcfe;stroke-width:3px;stroke-linejoin:round;}
.vec-svg .zero-dot{fill:var(--rule-color);}
.vec-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px;font-size:.82em;}
.vec-legend .lg{display:inline-flex;align-items:center;gap:5px;font-weight:700;}
.vec-legend .swatch{width:22px;height:0;border-top:3px solid;border-radius:2px;}
.vec-legend .lg.blue{color:var(--n-color);}
.vec-legend .lg.green{color:var(--an-color);}
.vec-legend .lg.purple{color:var(--rule-color);}
/* 切り替え操作の状態表示（何回切り替えたか・今どちらの状態か） */
.toggle-state{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.85em;color:var(--text-soft);}
.toggle-state .now{background:var(--n-bg);color:var(--n-color);border-radius:999px;padding:2px 10px;font-weight:700;}
table.terms{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92em;}
table.terms th,table.terms td{border:1px solid var(--border);padding:8px;text-align:center;}
table.terms th{background:#f2f4f8;color:var(--text-soft);font-weight:700;}
/* =========================================================================
   LESSON-SPECIFIC-CSS-END
   ========================================================================= */
</style>
</head>
<body>
<div id="app">
  <header id="app-header"></header>
  <main id="app-main"></main>
  <footer id="app-footer"></footer>
</div>
<script>
'use strict';
/* =========================================================================
   LESSON-SPECIFIC-DATA-START
   ========================================================================= */
var LESSON_ID = '02';
var TEXTBOOK_REF = '教科書 p.10〜12（ベクトルの加法・減法）';
var CHART_REF = '黄チャート p.492〜495・p.499（基本例題1,2・ピンポイント解説）';
var STEPS = ['s1', 's2', 's3', 's4', 'summary'];
var STAGE_LABEL = { s1:'ステージ1', s2:'ステージ2', s3:'ステージ3', s4:'ステージ4', summary:'まとめ' };
var STAGE_SUBLABEL = {
  s1:'矢印をつないで和を作る',
  s2:'つなぐ順を入れかえて見比べる',
  s3:'和の性質を整理する',
  s4:'差の向きを見分ける',
  summary:'今日の理解を確認する'
};
var DOT_INDEX = { s1:0, s2:1, s3:2, s4:3, summary:4 };
var DOT_LABELS = ['1', '2', '3', '4', 'まとめ'];
function flowBadgeInner(){
  return '<span class="chip chip-n">つなぐ</span><span class="arrow">→</span>'
       + '<span class="chip chip-an">終点までの矢印</span><span class="arrow">→</span>'
       + '<span class="chip chip-rule">和と差</span>';
}
function newQuizState(){ return { qid:null, selected:null, answered:false, attempts:0, showAnswer:false }; }
function s1QuizPool(){
  return [
    { id:'tri-abc', ask:'点Aから点Bへ、点Bから点Cへ矢印をつなぎました。AB↑+BC↑ は、どの矢印と同じになりますか。',
      correct:'AC↑', options:['CA↑','BA↑','AC↑','BC↑'],
      hints:['矢印をつなげたとき、和の矢印は「最初の始点」から「最後の終点」へ向かいます。',
        '最初の始点はA、最後の終点はCです。'],
      reason:'AB↑+BC↑ は、最初の始点Aから最後の終点Cへ向かう矢印 AC↑ と同じになります（三角形則）。' },
    { id:'tri-oab', ask:'点Oから点Aへ、点Aから点Bへ矢印をつなぎました。OA↑+AB↑ は、どの矢印と同じになりますか。',
      correct:'OB↑', options:['BO↑','OB↑','AO↑','OA↑'],
      hints:['和の矢印は「最初の始点」から「最後の終点」へ向かう1本の矢印になります。',
        '最初の始点はO、最後の終点はBです。'],
      reason:'OA↑+AB↑ は、最初の始点Oから最後の終点Bへ向かう矢印 OB↑ と同じになります（三角形則）。' },
    { id:'tri-pqrs', ask:'P→Q→R→Sと3本の矢印をつなぎました。PQ↑+QR↑+RS↑ は、どの矢印と同じになりますか。',
      correct:'PS↑', options:['SP↑','PR↑','QS↑','PS↑'],
      hints:['3本つないでも考え方は同じです。最初の始点から最後の終点への矢印になります。',
        '最初の始点はP、最後の終点はSです。'],
      reason:'矢印を何本つないでも、和は「最初の始点」から「最後の終点」への矢印になります。ここでは PS↑ です。' }
  ];
}
var S2_MC_OPTIONS = ['別の点になる', '同じ点になる', 'b の長さによって変わる'];
var S2_MC_CORRECT = '同じ点になる';
function s2QuizPool(){
  return [
    { id:'comm-ab', ask:'a+b と b+a を比べると、どんな関係にありますか。',
      correct:'常に等しい', options:['a+bの方が長い','常に等しい','b+aの方が長い','向きが逆になる'],
      hints:['つなぐ順を変えても、たどりつく点は同じでした。',
        '和の性質を思い出しましょう。'],
      reason:'a+b と b+a は、つなぐ順が違っても同じ点にたどりつくので常に等しくなります（交換法則）。' },
    { id:'para-oacb', ask:'平行四辺形 OACB において、OA↑+OB↑ は、どの矢印と同じになりますか。',
      correct:'OC↑', options:['AB↑','BA↑','CO↑','OC↑'],
      hints:['平行四辺形の対角線が、隣り合う2辺の和になります。',
        'Oから対角の頂点Cへ向かう矢印を考えましょう。'],
      reason:'平行四辺形 OACB では、隣り合う2辺 OA↑ と OB↑ の和は、対角線 OC↑ と一致します（平行四辺形則）。' },
    { id:'route-diff', ask:'Oから同じ点Bまで行くのに、Aを経由しても、別の点Cを経由しても、矢印の和は変わりますか。',
      correct:'変わらない', options:['経由地によって変わる','長い経路の方が大きくなる','変わらない'],
      hints:['どちらの経路も同じ点Oから出発して、同じ点Bにたどりついています。',
        '経由地が違っても、最初の始点と最後の終点が同じなら…'],
      reason:'経由地が違っても、最初の始点Oと最後の終点Bが同じなら、矢印の和（合計の移動）は変わりません。' }
  ];
}
function s3QuizPool(){
  return [
    { id:'a-plus-neg-a', ask:'a+(−a) は、どんなベクトルになりますか。',
      correct:'零ベクトル0', options:['単位ベクトル','a と同じベクトル','零ベクトル0','逆ベクトル'],
      hints:['aと逆ベクトル−aをつなぐと、矢印の先はどこに戻りますか。',
        '始点と終点が同じ場所になるベクトルの名前を思い出しましょう。'],
      reason:'aの終点に−aをつなぐと、出発点にちょうど戻ります。始点と終点が同じなので、a+(−a) は零ベクトル0です。' },
    { id:'a-plus-zero', ask:'a+0 は、どんなベクトルになりますか。',
      correct:'a', options:['a','0','−a','a の2倍'],
      hints:['零ベクトルをつないでも、矢印の先の位置は変わりません。',
        '0は大きさ0なので、つないでも動きません。'],
      reason:'零ベクトル0は大きさが0なので、aにつないでも終点は動きません。a+0=a です。' },
    { id:'assoc', ask:'(a+b)+c と a+(b+c) を比べると、どんな関係にありますか。',
      correct:'常に等しい', options:['計算する順で結果が変わる','常に等しい','cの位置によって変わる'],
      hints:['先に a+b を計算してから c をつないでも、先に b+c を計算してから a につないでも、たどりつく点は同じです。',
        'どちらも最初の始点から最後の終点まで、同じ3本をつないでいます。'],
      reason:'どちらの順で計算しても、最初の始点から最後の終点まで同じ3本の矢印をつないでいるので、常に等しくなります（結合法則）。' }
  ];
}
function s4QuizPool(){
  return [
    { id:'diff-rewrite', ask:'a−b は、どんな式に書きかえられますか。',
      correct:'a+(−b)', options:['a+b','−a+b','−(a+b)','a+(−b)'],
      hints:['引き算は「逆ベクトルを足すこと」と考えられます。',
        'bを引くことは、−bを足すことと同じです。'],
      reason:'a−b は、bの逆ベクトル−bを足すことと同じなので、a+(−b) と書きかえられます。' },
    { id:'diff-arrow', ask:'a、bを同じ始点から出したとき、a−b はどの矢印になりますか。',
      correct:'bの終点からaの終点へ向かう矢印',
      options:['aの終点からbの終点へ向かう矢印','bの終点からaの終点へ向かう矢印','原点からaとbの中点へ向かう矢印'],
      hints:['a−b=a+(−b) なので、aの終点に−bをつないだ先を考えましょう。',
        'a、bを同じ始点から出したとき、差の矢印は2つの終点を結びます。'],
      reason:'a、bを同じ始点から出したとき、a−b はbの終点からaの終点へ向かう矢印になります。' },
    { id:'diff-ob-oa', ask:'OB↑−OA↑ は、どの矢印と同じになりますか。',
      correct:'AB↑', options:['BA↑','OA↑','AB↑','OB↑'],
      hints:['OB↑−OA↑=OB↑+(−OA↑) です。−OA↑はAからOへ向かう矢印です。',
        'Aの位置からBの位置へ向かう矢印を考えましょう。'],
      reason:'OB↑−OA↑ は、Aの終点からBの終点へ向かう矢印、つまりAB↑と同じです。始点Oが消えて、A→Bの移動だけが残ります。' }
  ];
}
var SUMMARY_POINTS = [
  '矢印をつなぐと、その和は「最初の始点」から「最後の終点」への矢印になる（三角形則）',
  'つなぐ順を入れかえても和は変わらない（交換法則）。隣り合う2辺の和は平行四辺形の対角線になる（平行四辺形則）',
  '3本以上つないでも、どこで区切って計算しても和は変わらない（結合法則）。a+0=a、a+(−a)=0 が成り立つ',
  '差 a−b は a+(−b) と同じで、図では「bの終点からaの終点へ向かう矢印」になる'
];
var SUMMARY_QA = [
  { q:'a+b をかくとき、bの矢印をどこから描き始めますか。理由もあわせて説明してみましょう。',
    points:['aの終点から、bを描き始める',
      '矢印をつなげたとき、和は最初の始点から最後の終点への矢印になるから'] },
  { q:'a−b と b−a は、どう違いますか。自分の言葉で説明してみましょう。',
    points:['a−b はbの終点からaの終点へ、b−a はaの終点からbの終点へ向かう矢印になる',
      '長さは同じだが、向きがちょうど真逆になる'] }
];
var CHECKLIST_ITEMS = [

function lapStorageAvailable(){

function readLapCount(){
  if (!lapStorageAvailable()) return 0;

    var v = parseInt(localStorage.getItem(lapStorageKey()), 10);
    return (isFinite(v) && v > 0) ? v : 0;
  } catch(e){ return 0; }
}

function renderQuizBlock(pool, qState, answerAction, nextAction){
  var q = pool.filter(function(p){ return p.id === qState.qid; })[0];
  if (!q){ q = pickQuestion(pool, null); qState.qid = q.id; }
  var base = answerAction.replace(/-answer$/, '');
  var solved = qState.answered && qState.selected === q.correct;
  var locked = solved || qState.showAnswer;
  var html = '';
  if (q.given) html += '<div class="quiz-given">'+q.given+'</div>';
  html += '<div class="quiz-q">Q. '+q.ask+'</div>';

      if (opt === q.correct) cls += ' correct-ans';
      else if (opt === qState.selected) cls += ' selected';
    } else if (qState.answered && opt === qState.selected){
      cls += ' selected';
    }
    html += '<button class="'+cls+'" data-action="'+answerAction+'" data-value="'+escAttr(opt)+'" '+(qState.answered?'disabled':'')+'>'+opt+'</button>';
  });
  html += '</div>';
  if (solved){
    html += '<div class="feedback ok"><b>正解です。</b>'+q.reason+'</div>';
    html += '<div class="btn-row"><button class="btn" data-action="'+nextAction+'">別の問題にする</button></div>';
  } else if (qState.showAnswer){
    html += '<div class="feedback warn"><b>考え方を確認しましょう。</b>'+q.reason+'</div>';
    html += '<div class="btn-row"><button class="btn" data-action="'+nextAction+'">別の問題にする</button></div>';
  } else if (qState.answered){
    var attempts = qState.attempts || 1;
    var hints = q.hints || [];
    var hint = hints[Math.min(attempts-1, hints.length-1)] || 'もう一度、問題文と選択肢を見比べてみましょう。';
    html += '<div class="feedback warn"><b>答えと考え方を確認しましょう。</b>'+hint+'</div>';
    html += '<div class="btn-row"><button class="btn" data-action="'+base+'-retry">もう一度考える</button>';
    if (attempts >= 2){

}

  } else if (sub[key+'ShowAnswer']){
    html += '<div class="feedback warn"><b>考え方を確認しましょう。</b>'+correctReason+'</div>';
  } else {
    var attempts = sub[key+'Attempts'] || 1;
    var hint = hints[Math.min(attempts-1, hints.length-1)];
    html += '<div class="feedback warn"><b>答えと考え方を確認しましょう。</b>'+hint+'</div>';
    html += '<div class="btn-row"><button class="btn" data-action="'+actionBase+'-retry">もう一度考える</button>';
    if (attempts >= 2){

var SVG_OX = 44, SVG_OY = 200, SVG_U = 26;
var SVG_W = 300, SVG_H = 230;
function sx(mx){ return SVG_OX + mx*SVG_U; }
function sy(my){ return SVG_OY - my*SVG_U; }
var SVG_COLORS = { blue:'var(--n-color)', green:'var(--an-color)', purple:'var(--rule-color)' };
function svgGridAxis(){
  var g = '';
  var i;
  for (i=0;i<=8;i++){ g += '<line class="grid-line" x1="'+sx(i)+'" y1="'+sy(0)+'" x2="'+sx(i)+'" y2="'+sy(7)+'"/>'; }
  for (i=0;i<=7;i++){ g += '<line class="grid-line" x1="'+sx(0)+'" y1="'+sy(i)+'" x2="'+sx(8)+'" y2="'+sy(i)+'"/>'; }
  g += '<line class="axis-line" x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(8)+'" y2="'+sy(0)+'"/>';
  g += '<line class="axis-line" x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(0)+'" y2="'+sy(7)+'"/>';
  g += '<text class="axis-label" x="'+(sx(8)-2)+'" y="'+(sy(0)+14)+'">x</text>';
  g += '<text class="axis-label" x="'+(sx(0)-14)+'" y="'+(sy(7)+4)+'">y</text>';
  g += '<text class="axis-label" x="'+(sx(0)-12)+'" y="'+(sy(0)+14)+'">O</text>';
  return g;
}
/* 矢印の先端。markerUnits="userSpaceOnUse" にして、線の太さに関係なく
   一定の大きさ（12px）にする。こうしないと線の太さの倍率で拡大され、
   短い矢印では先端だけが大きく見えてしまう。 */
function svgMarkers(idp){
  var m = '';
  ['blue','green','purple'].forEach(function(c){
    m += '<marker id="'+idp+'-'+c+'" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">'
       + '<path d="M0,0 L12,6 L0,12 z" fill="'+SVG_COLORS[c]+'"/></marker>';
  });
  return m;
}
/* 矢印1本。side に −1 を指定するとラベルを線の反対側へ出す
   （2本が重なる図で、両方のラベルを重ねずに表示するために使う）。 */
function svgArrow(idp, color, mx1, my1, mx2, my2, label, dashed, side){
  var x1=sx(mx1), y1=sy(my1), x2=sx(mx2), y2=sy(my2);
  var dash = dashed ? ' stroke-dasharray="5 4"' : '';
  var s = '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+SVG_COLORS[color]+'" stroke-width="2.6" stroke-linecap="round" marker-end="url(#'+idp+'-'+color+')"'+dash+'/>';
  if (label){
    var dx = x2-x1, dy = y2-y1;
    var L = Math.sqrt(dx*dx + dy*dy) || 1;
    var px = -dy/L, py = dx/L;
    if (px > 0){ px = -px; py = -py; }
    if (side === -1){ px = -px; py = -py; }
    var OFF = 12;
    var lx = (x1+x2)/2 + px*OFF, ly = (y1+y2)/2 + py*OFF + 5;
    s += '<text class="vlabel '+color+'" x="'+lx+'" y="'+ly+'" text-anchor="middle">'+label+'</text>';
  }
  return s;
}
function buildSvg(idp, arrows, extras){
  var s = '<div class="vec-svg-wrap"><svg class="vec-svg" viewBox="0 0 '+SVG_W+' '+SVG_H+'" role="img">';
  s += '<defs>'+svgMarkers(idp)+'</defs>';
  s += svgGridAxis();
  if (extras) s += extras;
  arrows.forEach(function(a){
    s += svgArrow(idp, a.c, a.x1, a.y1, a.x2, a.y2, a.label, a.dashed, a.side);
  });
  s += '</svg></div>';
  return s;
}

  });
  s += '</div>';
  return s;
}

        + (s.orderSwapped ? 'a→b の順に戻す' : 'b→a の順に入れかえる') + '</button>';
  html += '  </div>';
  html += '  <div class="toggle-state"><span class="now">今の状態：'
        + (s.orderSwapped ? 'b→a の順' : 'a→b の順') + '</span>'
        + '<span>切り替えた回数：'+s.orderCount+' 回</span>'
        + '<span>何度でも切り替えて見比べられます。</span></div>';
  if (s.orderEverSwapped){
    html += '  <p class="lead" style="margin-top:14px;">Q. a に b をつないだ終点と、b に a をつないだ終点は、どうなりますか。</p>';
    html += '  <div class="btn-row">';
    (function(){
      var locked = mcDone(s, 'mc', S2_MC_CORRECT);
      S2_MC_OPTIONS.forEach(function(opt){
        var cls = 'btn';
        if (locked){
          if (opt === S2_MC_CORRECT) cls += ' correct-ans';
          else if (opt === s.mcSelected) cls += ' selected';
        } else if (s.mcAnswered && opt === s.mcSelected){
          cls += ' selected';
        }
        html += '<button class="'+cls+'" data-action="s2-mc-answer" data-value="'+escAttr(opt)+'" '+(s.mcAnswered?'disabled':'')+'>'+opt+'</button>';
      });
    })();
    html += '  </div>';
    html += mcFeedback(s, 'mc', S2_MC_CORRECT,
      ['2つの順路を切り替えて、矢印の先がどこに来るか見比べましょう。',
       'どちらの順路でも、同じ平行四辺形の対角線をたどっています。'],
      'つなぐ順を入れかえても終点は変わらないので a+b=b+a（交換法則）が成り立ちます。この図は、平行四辺形の対角線が2辺の和になっていることも示しています（平行四辺形則）。', 's2-mc');
  }
  html += '</div>';
  if (s.orderEverSwapped && mcDone(s, 'mc', S2_MC_CORRECT)){
    html += '<div class="panel">';
    html += '  <h2 class="stage-title" style="font-size:1.05em;">交換法則・平行四辺形則</h2>';
    html += '  <p class="lead">つなぐ順を入れかえても、和の矢印（終点）は変わりません。これを交換法則といいます。同じ始点から a と b を描くと、その和は平行四辺形の対角線として描くこともできます。</p>';
    html += '<div class="fix-change">';
    html += '  <div class="fc-box fixed"><span class="fc-label">変わらないもの</span><div class="fc-val">和の終点</div></div>';
    html += '  <div class="fc-box change"><span class="fc-label">入れかえてよいもの</span><div class="fc-val">つなぐ順</div></div>';
    html += '  <div class="fc-box result"><span class="fc-label">結論</span><div class="fc-val">a+b = b+a</div></div>';
    html += '</div>';
    html += '</div>';
    html += '<div class="panel">';
    html += '  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
    html += renderQuizBlock(s2QuizPool(), state.s2.quiz, 's2-quiz-answer', 's2-quiz-next');
    html += '</div>';
  }
  return html;
}
function handleS2ToggleOrder(){
  var s = state.s2;
  s.orderSwapped = !s.orderSwapped;
  s.orderCount = s.orderCount + 1;
  if (s.orderSwapped) s.orderEverSwapped = true;
  render();
}
function handleS2McAnswer(val){ mcAnswer(state.s2, 'mc', S2_MC_CORRECT, val); render(); }
function handleS2McRetry(){ mcRetry(state.s2, 'mc'); render(); }
function handleS2McReveal(){ mcReveal(state.s2, 'mc'); render(); }
function handleS2QuizAnswer(val){ handleQuizAnswer(state.s2, s2QuizPool(), val); }
function handleS2QuizRetry(){ handleQuizRetry(state.s2); }
function handleS2QuizReveal(){ handleQuizReveal(state.s2); }
function handleS2QuizNext(){ handleQuizNext(state.s2, s2QuizPool()); }
function renderStage3(){
  var html = '';
  html += '<div class="panel">';
  html += '  <h2 class="stage-title">和の性質を整理しよう</h2>';
  html += '  <p class="stage-goal">a に逆ベクトル −a をつなぐと、矢印の先はどこに戻るでしょうか。和の性質を図と表で整理します。</p>';
  html += '  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  var extras = '<circle class="zero-dot" cx="'+sx(0)+'" cy="'+sy(0)+'" r="4"/>';
  extras += '<text class="vlabel purple" x="'+(sx(0.7))+'" y="'+(sy(1.1))+'" text-anchor="middle">0</text>';
  extras += '<line class="helper-line" x1="'+(sx(0.35))+'" y1="'+(sy(0.7))+'" x2="'+(sx(0.08))+'" y2="'+(sy(0.15))+'"/>';
  extras += '<text class="helper-label" x="'+(sx(4)+6)+'" y="'+(sy(3)-4)+'">A</text>';
  html += buildSvg('s3', [
    {c:'blue', x1:0, y1:0, x2:4, y2:3, label:'a', dashed:true, side:1},
    {c:'purple', x1:4, y1:3, x2:0, y2:0, label:'−a', side:-1}
  ], extras);
  html += vecLegend([{c:'blue',t:'a（点線、O→A）'},{c:'purple',t:'−a（実線、A→O、aの逆ベクトル）'}]);
  html += '  <p class="lead">a（O→A）に、逆ベクトル −a（A→O）をつなぐと、矢印の先はちょうど出発点Oに戻ります。始点と終点が同じなので、a+(−a) は零ベクトル0です。</p>';
  html += '<table class="terms"><tr><th>性質</th><th>式</th><th>意味</th></tr>';
  html += '<tr><td>交換法則</td><td>a+b = b+a</td><td>つなぐ順を入れかえても和は同じ</td></tr>';
  html += '<tr><td>結合法則</td><td>(a+b)+c = a+(b+c)</td><td>区切る位置を変えても和は同じ</td></tr>';
  html += '<tr><td>零ベクトルとの和</td><td>a+0 = a</td><td>0をつないでも終点は動かない</td></tr>';
  html += '<tr><td>逆ベクトルとの和</td><td>a+(−a) = 0</td><td>出発点にちょうど戻る</td></tr>';
  html += '</table>';
  html += '</div>';
  html += '<div class="panel">';
  html += '  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
  html += renderQuizBlock(s3QuizPool(), state.s3.quiz, 's3-quiz-answer', 's3-quiz-next');
  html += '</div>';
  return html;
}
function handleS3QuizAnswer(val){ handleQuizAnswer(state.s3, s3QuizPool(), val); }
function handleS3QuizRetry(){ handleQuizRetry(state.s3); }
function handleS3QuizReveal(){ handleQuizReveal(state.s3); }
function handleS3QuizNext(){ handleQuizNext(state.s3, s3QuizPool()); }
/* ---- ステージ4：a−b と b−a を何度でも切り替えて、向きの違い（反例）を見比べる ---- */
function renderStage4(){
  var s = state.s4;
  var html = '';
  html += '<div class="panel">';
  html += '  <h2 class="stage-title">差はどちら向きの矢印か</h2>';
  html += '  <p class="stage-goal">同じ始点Oから出た a と b について、差 a−b と b−a を見比べます。長さは同じですが、向きが真逆になります。</p>';
  html += '  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  var baseExtras = '<text class="helper-label" x="'+(sx(0)-10)+'" y="'+(sy(0)+16)+'">O</text>'
    + '<text class="helper-label" x="'+(sx(5)+6)+'" y="'+(sy(2)-4)+'">A</text>'
    + '<text class="helper-label" x="'+(sx(1)-14)+'" y="'+(sy(4)+4)+'">B</text>';
  if (!s.diffSwapped){
    html += buildSvg('s4a', [
      {c:'blue', x1:0, y1:0, x2:5, y2:2, label:'a'},
      {c:'green', x1:0, y1:0, x2:1, y2:4, label:'b'},
      {c:'purple', x1:1, y1:4, x2:5, y2:2, label:'a−b', side:-1}
    ], baseExtras);
    html += vecLegend([{c:'blue',t:'a（O→A）'},{c:'green',t:'b（O→B）'},{c:'purple',t:'a−b（B→A）'}]);
    html += '  <p class="lead">a−b=a+(−b) なので、bの終点Bからaの終点Aへ向かう矢印になります。b→a に切り替えると、向きはどうなるでしょうか。</p>';
  } else {
    html += buildSvg('s4b', [
      {c:'blue', x1:0, y1:0, x2:5, y2:2, label:'a'},
      {c:'green', x1:0, y1:0, x2:1, y2:4, label:'b'},
      {c:'purple', x1:5, y1:2, x2:1, y2:4, label:'b−a', side:1}
    ], baseExtras);
    html += vecLegend([{c:'blue',t:'a（O→A）'},{c:'green',t:'b（O→B）'},{c:'purple',t:'b−a（A→B）'}]);
    html += '  <p class="lead">b−a は、aの終点Aからbの終点Bへ向かう矢印になります。長さは a−b と同じですが、<b>向きがちょうど真逆</b>です。a−b と b−a を取り違えないよう注意しましょう。</p>';
  }
  html += '  <div class="btn-row">';
  html += '<button class="btn primary" data-action="s4-toggle-diff">'
        + (s.diffSwapped ? 'a−b の向きに戻す' : 'b−a の向きに切り替える') + '</button>';
  html += '  </div>';
  html += '  <div class="toggle-state"><span class="now">今の状態：'
        + (s.diffSwapped ? 'b−a' : 'a−b') + '</span>'
        + '<span>切り替えた回数：'+s.diffCount+' 回</span>'
        + '<span>何度でも切り替えて見比べられます。</span></div>';
  html += '  <p class="small-note">差 a−b は a+(−b) と同じ意味です。同じ始点から出た2本の矢印では、差の矢印は「引く方の終点」から「引かれる方の終点」へ向かいます。</p>';
  html += '</div>';
  html += '<div class="panel">';
  html += '  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
  html += renderQuizBlock(s4QuizPool(), state.s4.quiz, 's4-quiz-answer', 's4-quiz-next');
  html += '</div>';
  return html;
}
function handleS4ToggleDiff(){
  var s = state.s4;
  s.diffSwapped = !s.diffSwapped;
  s.diffCount = s.diffCount + 1;
  if (s.diffSwapped) s.diffEverSwapped = true;
  render();
}
function handleS4QuizAnswer(val){ handleQuizAnswer(state.s4, s4QuizPool(), val); }
function handleS4QuizRetry(){ handleQuizRetry(state.s4); }
function handleS4QuizReveal(){ handleQuizReveal(state.s4); }
function handleS4QuizNext(){ handleQuizNext(state.s4, s4QuizPool()); }
function stepGateMessage(){
  var key = STEPS[state.stepIndex];
  if (key === 's2' && !(state.s2.orderEverSwapped && mcDone(state.s2, 'mc', S2_MC_CORRECT))){
    return 'このステージには、まだ確認していない内容があります。先に現在の問題を進めましょう。';
  }
  return null;
}
var RENDERERS = {
  s1: renderStage1,
  s2: renderStage2,
  s3: renderStage3,
  s4: renderStage4,
  summary: renderSummary
};
function handleAction(action, value, el){
  switch(action){
    case 'next': goNext(); break;
    case 'prev': goPrev(); break;
    case 'restart': restartAll(); break;
    case 'complete': handleComplete(); break;
    case 's1-quiz-answer': handleS1QuizAnswer(value); break;
    case 's1-quiz-retry': handleS1QuizRetry(); break;
    case 's1-quiz-reveal': handleS1QuizReveal(); break;
    case 's1-quiz-next': handleS1QuizNext(); break;
    case 's2-toggle-order': handleS2ToggleOrder(); break;
    case 's2-mc-answer': handleS2McAnswer(value); break;
    case 's2-mc-retry': handleS2McRetry(); break;
    case 's2-mc-reveal': handleS2McReveal(); break;
    case 's2-quiz-answer': handleS2QuizAnswer(value); break;
    case 's2-quiz-retry': handleS2QuizRetry(); break;
    case 's2-quiz-reveal': handleS2QuizReveal(); break;
    case 's2-quiz-next': handleS2QuizNext(); break;
    case 's3-quiz-answer': handleS3QuizAnswer(value); break;
    case 's3-quiz-retry': handleS3QuizRetry(); break;
    case 's3-quiz-reveal': handleS3QuizReveal(); break;
    case 's3-quiz-next': handleS3QuizNext(); break;
    case 's4-toggle-diff': handleS4ToggleDiff(); break;
    case 's4-quiz-answer': handleS4QuizAnswer(value); break;
    case 's4-quiz-retry': handleS4QuizRetry(); break;
    case 's4-quiz-reveal': handleS4QuizReveal(); break;
    case 's4-quiz-next': handleS4QuizNext(); break;
    case 'summary-reveal': handleSummaryReveal(value); break;
    case 'summary-check': handleSummaryCheck(value); break;
  }
}

   LESSON-SPECIFIC-RENDERERS-END
   ========================================================================= */

render();
