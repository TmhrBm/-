<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>空間座標と空間ベクトルの成分 ー 体験教材</title>
<style>
/* =========================================================================
   APP-COMMON-CSS-START
   ========================================================================= */
:root{
  --n-color:#1d4ed8;
  --n-bg:#e5edfc;
  --an-color:#0f7a3d;
  --an-bg:#e2f5e9;
  --rule-color:#be185d;
  --rule-bg:#fce7f3;
  --correct:#178a43;
  --correct-bg:#e5f7ec;
  --caution:#c65a12;
  --caution-bg:#fdf0e4;
  --bg:#f6f7fa;
  --card:#ffffff;
  --border:#dfe3ea;
  --text:#20242c;
  --text-soft:#666f7d;
  --radius:14px;
  --radius-sm:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
  line-height:1.75;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:840px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible, input:focus-visible{outline:3px solid #93b4f7;outline-offset:2px;}
input[type=number]{font-family:inherit;font-size:1.05em;}
#app-header{
  padding:14px 18px 10px;
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
}
.header-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.82em;color:var(--text-soft);margin:0 0 8px;letter-spacing:.02em;}
.header-title .ht-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lap-badge{background:var(--an-bg);color:var(--an-color);border-radius:999px;padding:2px 10px;font-size:.9em;font-weight:700;white-space:nowrap;flex:0 0 auto;}
.stage-dots{display:flex;align-items:center;gap:6px;}
.stage-dot{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:.72em;color:var(--text-soft);
}
.stage-dot .dot{
  width:26px;height:26px;border-radius:50%;
  background:#eceff3;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.9em;color:var(--text-soft);
  transition:all .2s;
}
.stage-dot.active .dot{background:var(--n-color);border-color:var(--n-color);color:#fff;}
.stage-dot.done .dot{background:var(--an-bg);border-color:var(--an-color);color:var(--an-color);}
.stage-dot.active{color:var(--n-color);font-weight:700;}
.stage-sub{font-size:.78em;color:var(--text-soft);margin-top:6px;}
#app-main{flex:1;padding:18px 18px 30px;}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:16px;
}
h2.stage-title{font-size:1.25em;margin:0 0 6px;}
p.stage-goal{color:var(--text-soft);font-size:.92em;margin:0 0 14px;}
p.lead{margin:0 0 12px;font-size:.97em;}
.small-note{font-size:.85em;color:var(--text-soft);margin-top:8px;}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:999px;font-size:.88em;font-weight:700;
}
.chip-n{background:var(--n-bg);color:var(--n-color);}
.chip-an{background:var(--an-bg);color:var(--an-color);}
.chip-rule{background:var(--rule-bg);color:var(--rule-color);}
.seq-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:14px 0;}
.term-card{
  border:2px solid var(--border);background:var(--card);
  border-radius:10px;padding:8px 4px 10px;min-width:58px;text-align:center;
  cursor:default;
}
.term-card .n-label{color:var(--n-color);font-size:.76em;font-weight:700;}
.term-card .val{font-size:1.25em;font-weight:800;color:var(--text);margin-top:2px;}
.term-card.dots{cursor:default;border-style:dashed;color:var(--text-soft);}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
.btn{
  border:2px solid var(--border);background:#fff;color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:.95em;font-weight:700;
}
.btn:hover{border-color:var(--n-color);}
.btn.primary{background:var(--n-color);border-color:var(--n-color);color:#fff;}
.btn.primary:hover{background:#1a44b8;}
.btn.ghost{background:transparent;}
.btn.selected{border-color:var(--rule-color);background:var(--rule-bg);color:var(--rule-color);}
.btn.correct-ans{border-color:var(--correct);background:var(--correct-bg);color:var(--correct);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.sm{padding:6px 12px;font-size:.85em;}
.btn.complete{background:var(--correct);border-color:var(--correct);color:#fff;}
.btn.complete:hover{background:#0f6b34;}
.btn.complete.done{background:var(--correct-bg);color:var(--correct);}
.feedback{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.94em;}
.feedback.ok{background:var(--correct-bg);color:var(--correct);border:1.5px solid var(--correct);}
.feedback.warn{background:var(--caution-bg);color:var(--caution);border:1.5px solid var(--caution);}
.feedback b{display:block;margin-bottom:2px;font-size:1.02em;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-size:.92em;line-height:1.15;}
.frac .num{padding:0 5px 2px;border-bottom:2px solid currentColor;}
.frac .den{padding:2px 5px 0;}
.math-lg{font-size:1.35em;font-weight:700;}
.fix-change{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;}
.fc-box{border-radius:10px;padding:10px;text-align:center;font-size:.85em;}
.fc-box .fc-label{font-weight:700;margin-bottom:4px;display:block;}
.fc-box.fixed{background:var(--rule-bg);color:var(--rule-color);}
.fc-box.change{background:var(--n-bg);color:var(--n-color);}
.fc-box.result{background:var(--an-bg);color:var(--an-color);}
.fc-box .fc-val{font-weight:800;font-size:1.1em;margin-top:2px;}
.step-flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0;}
.step-box{
  border:2px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;min-width:80px;background:#fff;
}
.step-box .step-label{font-size:.75em;color:var(--text-soft);margin-bottom:3px;}
.step-arrow{color:var(--text-soft);font-size:1.3em;}
.flow-vert{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.flow-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.flow-arrow-down{color:var(--text-soft);font-size:1.2em;padding-left:6px;}
.flow-result{border:2px solid var(--rule-color);background:var(--rule-bg);border-radius:10px;padding:12px 16px;text-align:center;color:var(--rule-color);font-weight:800;}
.flow-badge{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
.flow-badge .arrow{color:var(--text-soft);font-size:.9em;}
table.verify{width:100%;border-collapse:collapse;margin-top:12px;font-size:.92em;}
table.verify th,table.verify td{border:1px solid var(--border);padding:7px 8px;text-align:center;}
table.verify th{background:#f2f4f8;color:var(--text-soft);font-weight:700;}
table.verify td.mark-ok{color:var(--correct);font-weight:800;}
table.verify td.mark-ng{color:var(--caution);font-weight:800;}
.check-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:.95em;}
.check-item:last-child{border-bottom:none;}
.check-item input{width:19px;height:19px;accent-color:var(--an-color);}
.quiz-given{background:#f7f9fc;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px;font-size:.92em;}
.quiz-q{font-weight:700;margin-bottom:10px;}
.quiz-options{display:flex;flex-wrap:wrap;gap:8px;}
#app-footer{
  position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);
  padding:12px 18px;display:flex;gap:10px;justify-content:space-between;
}
#app-footer .btn{flex:1;text-align:center;}
#app-footer .btn.restart{flex:0 0 auto;}
@media (max-width:520px){
  .fix-change{grid-template-columns:1fr;}
  #app-main{padding:14px 12px 24px;}
  .panel{padding:14px;}
  .stage-dot{font-size:.62em;}
  .stage-dot .dot{width:22px;height:22px;font-size:.8em;}
}
@media print{
  #app-footer, .btn, .quiz-options, input{display:none !important;}
  #app-header{position:static;}
  body{background:#fff;}
  .lap-badge{display:none !important;}
}
/* =========================================================================
   APP-COMMON-CSS-END
   ========================================================================= */
/* =========================================================================
   LESSON-SPECIFIC-CSS-START
   ベクトル教材固有：3D風（斜投影）の空間座標SVG。
   座標軸は教科書と同じ向き（z=上、y=右、x=手前の左下）にし、
   矢印（ベクトル）と軸が重ならないようにしている。
   ========================================================================= */
.vec-svg-wrap{display:flex;justify-content:center;margin:14px 0 6px;}
.vec-svg{width:100%;max-width:400px;height:auto;background:#fbfcfe;border:1px solid var(--border);border-radius:10px;}
/* 軸は細く薄く（ベクトルより目立たせない） */
.vec-svg .axis3d{stroke:#c3cad6;stroke-width:1.2;}
.vec-svg .axis-label{fill:var(--text-soft);font-size:12px;font-weight:800;paint-order:stroke;stroke:#fbfcfe;stroke-width:3px;stroke-linejoin:round;}
.vec-svg .depth-line{stroke:var(--text-soft);stroke-width:1.2;stroke-dasharray:4 3;}
.vec-svg .depth-label{fill:var(--text-soft);font-size:11px;font-weight:700;paint-order:stroke;stroke:#fbfcfe;stroke-width:3px;stroke-linejoin:round;}
.vec-svg .vlabel{font-size:14px;font-weight:800;paint-order:stroke;stroke:#fbfcfe;stroke-width:3.5px;stroke-linejoin:round;}
.vec-svg .vlabel.blue{fill:var(--n-color);}
.vec-svg .vlabel.green{fill:var(--an-color);}
.vec-svg .vlabel.purple{fill:var(--rule-color);}
.vec-svg .pt-dot{fill:var(--n-color);}
.vec-svg .pt-dot.green{fill:var(--an-color);}
.vec-legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px;font-size:.82em;}
.vec-legend .lg{display:inline-flex;align-items:center;gap:5px;font-weight:700;}
.vec-legend .swatch{width:22px;height:0;border-top:3px solid;border-radius:2px;}
.vec-legend .lg.blue{color:var(--n-color);}
.vec-legend .lg.green{color:var(--an-color);}
.vec-legend .lg.purple{color:var(--rule-color);}
.vec-legend .lg.gray{color:var(--text-soft);}
.vec-legend .lg.gray .swatch{border-top-width:2px;}
/* 切り替え操作の状態表示（何回切り替えたか・今どちらの状態か） */
.toggle-state{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.85em;color:var(--text-soft);}
.toggle-state .now{background:var(--n-bg);color:var(--n-color);border-radius:999px;padding:2px 10px;font-weight:700;}
table.terms{width:100%;border-collapse:collapse;margin:12px 0;font-size:.92em;}
table.terms th,table.terms td{border:1px solid var(--border);padding:8px;text-align:center;}
table.terms th{background:#f2f4f8;color:var(--text-soft);font-weight:700;}
table.terms td.hl{color:var(--rule-color);font-weight:800;}
/* =========================================================================
   LESSON-SPECIFIC-CSS-END
   ========================================================================= */
</style>
</head>
<body>
<div id="app">
  <header id="app-header"></header>
  <main id="app-main"></main>
  <footer id="app-footer"></footer>
</div>
<script>
'use strict';
/* =========================================================================
   LESSON-SPECIFIC-DATA-START
   ========================================================================= */
var LESSON_ID = '08';
var TEXTBOOK_REF = '教科書 p.49〜57（空間の座標・空間ベクトルの成分）';
var CHART_REF = '黄チャート p.565〜572（空間ベクトルの基本事項）';
var STEPS = ['s1', 's2', 's3', 's4', 'summary'];
var STAGE_LABEL = { s1:'ステージ1', s2:'ステージ2', s3:'ステージ3', s4:'ステージ4', summary:'まとめ' };
var STAGE_SUBLABEL = {
  s1:'空間の点を座標で見る',
  s2:'成分が2つから3つに増える',
  s3:'成分の計算と大きさ',
  s4:'2点からベクトルを作る（反例）',
  summary:'今日の理解を確認する'
};
var DOT_INDEX = { s1:0, s2:1, s3:2, s4:3, summary:4 };
var DOT_LABELS = ['1', '2', '3', '4', 'まとめ'];
function flowBadgeInner(){
  return '<span class="chip chip-n">平面 (x, y)</span><span class="arrow">→</span>'
       + '<span class="chip chip-rule">奥行きを足す</span><span class="arrow">→</span>'
       + '<span class="chip chip-an">空間 (x, y, z)</span>';
}
function newQuizState(){ return { qid:null, selected:null, answered:false, attempts:0, showAnswer:false }; }
function s1QuizPool(){
  return [
    { id:'mag-236', ask:'空間ベクトル a=(2, 3, 6) の大きさ |a| はいくつですか。', correct:'7',
      options:['9','7','11','36'],
      hints:['空間では |a|=√(x² + y² + z²) です。z成分も忘れずに足します。',
        '√(2²+3²+6²)=√(4+9+36)=√49 を計算しましょう。'],
      reason:'|a|=√(2²+3²+6²)=√(4+9+36)=√49=7 です。平面の √(x²+y²) に、z² を足すだけです。' },
    { id:'mag-122', ask:'空間ベクトル b=(1, 2, 2) の大きさ |b| はいくつですか。', correct:'3',
      options:['5','7','9','3'],
      hints:['空間では |b|=√(x² + y² + z²) です。',
        '√(1²+2²+2²)=√(1+4+4)=√9 を計算しましょう。'],
      reason:'|b|=√(1²+2²+2²)=√(1+4+4)=√9=3 です。' },
    { id:'mag-346', ask:'空間ベクトル c=(3, 4, 12) の大きさ |c| はいくつですか。', correct:'13',
      options:['17','19','13','25'],
      hints:['空間では |c|=√(x² + y² + z²) です。',
        '√(3²+4²+12²)=√(9+16+144)=√169 を計算しましょう。'],
      reason:'|c|=√(3²+4²+12²)=√(9+16+144)=√169=13 です。' }
  ];
}
var S2_MC_OPTIONS = ['2つ (a₁, a₂)', '3つ (a₁, a₂, a₃)', '4つ (a₁, a₂, a₃, a₄)'];
var S2_MC_CORRECT = '3つ (a₁, a₂, a₃)';
function s2QuizPool(){
  return [
    { id:'count', ask:'空間ベクトルを成分で表すと、いくつの数の組になりますか。',
      correct:'3つ (x, y, z)', options:['2つ (x, y)','5つ','3つ (x, y, z)'],
      hints:['平面の (x, y) に、何を1つ足したか思い出しましょう。',
        '奥行きを足すので、数は1つ増えます。'],
      reason:'平面の (x, y) に奥行き z を足すので、空間ベクトルは3つの数の組 (x, y, z) で表します。' },
    { id:'diff', ask:'平面ベクトルと空間ベクトルの一番の違いは何ですか。',
      correct:'成分（数）が1つ増えて3つになること', options:['成分（数）が1つ増えて3つになること','矢印でなくなること','大きさを考えなくなること'],
      hints:['ベクトルが「向きと大きさを持つ矢印」であることは、平面でも空間でも変わりません。',
        '変わるのは、位置を表す数の個数です。'],
      reason:'ベクトルが矢印であること・向きと大きさを持つことは変わりません。変わるのは、成分が2つから3つに増えることだけです。' },
    { id:'origin', ask:'空間の原点 O の座標は、次のどれですか。',
      correct:'(0, 0, 0)', options:['(0, 0)','(0, 0, 0)','(1, 1, 1)'],
      hints:['原点は、x・y・z のどの向きにも動いていない点です。',
        '空間なので数は3つ。すべて0です。'],
      reason:'空間の原点は、x も y も z も0の点なので (0, 0, 0) です。平面の (0,0) に z=0 を足した形です。' }
  ];
}
function s3QuizPool(){
  return [
    { id:'add', ask:'a=(1, 2, 3)、b=(4, 0, 1) のとき、a+b の成分はどれですか。',
      correct:'(5, 2, 4)', options:['(4, 0, 3)','(5, 2, 4)','(5, 2, 3)'],
      hints:['成分どうしを、x は x、y は y、z は z で足します。',
        '(1+4, 2+0, 3+1) を計算しましょう。'],
      reason:'a+b=(1+4, 2+0, 3+1)=(5, 2, 4) です。平面と同じで、対応する成分どうしを足すだけです。' },
    { id:'scalar', ask:'a=(2, −1, 3) のとき、2a の成分はどれですか。',
      correct:'(4, −2, 6)', options:['(4, −1, 3)','(2, −2, 6)','(4, −2, 6)'],
      hints:['実数倍は、すべての成分を同じ数だけかけます。',
        '(2×2, 2×(−1), 2×3) を計算しましょう。'],
      reason:'2a=(2×2, 2×(−1), 2×3)=(4, −2, 6) です。3つの成分すべてに2をかけます。' },
    { id:'mag2', ask:'a=(2, 2, 1) の大きさ |a| はいくつですか。',
      correct:'3', options:['3','4','5'],
      hints:['|a|=√(x²+y²+z²) です。',
        '√(2²+2²+1²)=√(4+4+1)=√9 を計算しましょう。'],
      reason:'|a|=√(2²+2²+1²)=√(4+4+1)=√9=3 です。' }
  ];
}
function s4QuizPool(){
  return [
    { id:'ab-basic', ask:'2点 A(1, 2, 3)、B(4, 6, 5) について、AB↑ の成分はどれですか。',
      correct:'(3, 4, 2)', options:['(5, 8, 8)','(3, 4, 2)','(−3, −4, −2)'],
      hints:['AB↑ は「B の座標 − A の座標」で、各成分ごとに引きます。',
        '(4−1, 6−2, 5−3) を計算しましょう。'],
      reason:'AB↑=(4−1, 6−2, 5−3)=(3, 4, 2) です。終点 B から始点 A を引きます（向きは A→B）。' },
    { id:'ab-reverse', ask:'2点 A(1, 2, 3)、B(4, 6, 5) について、BA↑ の成分はどれですか。',
      correct:'(−3, −4, −2)', options:['(5, 8, 8)','(3, 4, 2)','(−3, −4, −2)'],
      hints:['BA↑ は A→B ではなく B→A の向きです。「A の座標 − B の座標」で引きます。',
        '(1−4, 2−6, 3−5) を計算しましょう。向きが逆なので符号も逆になります。'],
      reason:'BA↑=(1−4, 2−6, 3−5)=(−3, −4, −2) です。AB↑ とは向きが逆なので、すべての符号が反対になります。引く順番を間違えないことが大切です。' },
    { id:'ab-z-forget', ask:'2点 A(2, 1, 4)、B(5, 3, 4) について、AB↑ の成分はどれですか。',
      correct:'(3, 2, 0)', options:['(3, 2, 0)','(3, 2)','(3, 2, 4)'],
      hints:['z成分も必ず計算します。z が同じ値でも、省略せず (…, …, 0) と書きます。',
        '(5−2, 3−1, 4−4) を計算しましょう。z成分は 4−4=0 です。'],
      reason:'AB↑=(5−2, 3−1, 4−4)=(3, 2, 0) です。z が同じでも z成分は消えず、0 として残ります。空間では成分は必ず3つ書きます（z を忘れるのが典型的な誤りです）。' }
  ];
}
var SUMMARY_POINTS = [
  '空間の点は、平面の (x, y) に奥行き z を足して (x, y, z) の3つの数で表す',
  '空間ベクトルも、成分が2つから3つに増えるだけで、向きと大きさを持つ矢印であることは平面と同じ',
  '成分の和・差・実数倍は、平面と同じく対応する成分どうしで計算する',
  '空間ベクトルの大きさは |a|=√(a₁²+a₂²+a₃²)（平面の √(a₁²+a₂²) に a₃² を足した形）',
  '2点 A・B から AB↑＝(B の座標)−(A の座標)。z成分も必ず計算し、同じ値でも 0 として残す'
];
var SUMMARY_QA = [
  { q:'平面ベクトルと空間ベクトルの違いを、自分の言葉で説明してみましょう。',
    points:['ベクトルが向きと大きさを持つ矢印であることは、平面でも空間でも同じ',
      '違いは、位置を表す成分が2つ (x,y) から3つ (x,y,z) に増えることだけ'] },

/* =========================================================================
   LESSON-SPECIFIC-RENDERERS-START
   空間座標を斜投影で描く。軸の向きは教科書と同じ：
     z軸＝真上、y軸＝右、x軸＝手前（左下）。
   図は大きめ（1目盛り32px）にして矢印の線分を長くし、
   矢印の先端は線の太さに関係なく一定サイズ（12px）にして、
   線分と先端の大きさのバランスをとっている。
   ========================================================================= */
var SVG_W = 360, SVG_H = 260;
var P_OX = 100, P_OY = 200, P_S = 32;
var P_DQ = P_S * 0.42 * 0.7071; /* x（手前方向）1単位あたりの画面オフセット */
var SVG_COLORS = { blue:'var(--n-color)', green:'var(--an-color)', purple:'var(--rule-color)', gray:'#c3cad6' };
/* 空間座標(x,y,z)→画面座標[X,Y]。x は左下へ、y は右へ、z は上へ。 */
function proj(x,y,z){
  var X = P_OX - x*P_DQ + y*P_S;
  var Y = P_OY + x*P_DQ - z*P_S;
  return [X, Y];
}
/* 矢印の先端。markerUnits="userSpaceOnUse" にして、線の太さで拡大されないようにする。
   これを付けないと、線の太さの倍率で先端が拡大され、短い矢印では
   先端だけが大きく見えてしまう。軸用（gray）はさらに小さくする。 */
function svgMarkers(idp){
  var m = '';
  ['blue','green','purple'].forEach(function(c){
    m += '<marker id="'+idp+'-'+c+'" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">'
       + '<path d="M0,0 L12,6 L0,12 z" fill="'+SVG_COLORS[c]+'"/></marker>';
  });
  m += '<marker id="'+idp+'-gray" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">'
     + '<path d="M0,0 L8,4 L0,8 z" fill="'+SVG_COLORS.gray+'"/></marker>';
  return m;
}
/* 3本の座標軸を描く（細く薄い線。ベクトルより目立たせない） */
function draw3DAxes(idp){
  var o = proj(0,0,0);
  var ax = proj(4.4,0,0), ay = proj(0,5.4,0), az = proj(0,0,4.4);
  var s = '';
  s += '<line class="axis3d" x1="'+o[0]+'" y1="'+o[1]+'" x2="'+ax[0]+'" y2="'+ax[1]+'" marker-end="url(#'+idp+'-gray)"/>';
  s += '<line class="axis3d" x1="'+o[0]+'" y1="'+o[1]+'" x2="'+ay[0]+'" y2="'+ay[1]+'" marker-end="url(#'+idp+'-gray)"/>';
  s += '<line class="axis3d" x1="'+o[0]+'" y1="'+o[1]+'" x2="'+az[0]+'" y2="'+az[1]+'" marker-end="url(#'+idp+'-gray)"/>';
  s += '<text class="axis-label" x="'+(ax[0]-12)+'" y="'+(ax[1]+10)+'">x</text>';
  s += '<text class="axis-label" x="'+(ay[0]+7)+'" y="'+(ay[1]+5)+'">y</text>';
  s += '<text class="axis-label" x="'+(az[0]-4)+'" y="'+(az[1]-8)+'">z</text>';
  s += '<text class="axis-label" x="'+(o[0]+5)+'" y="'+(o[1]+16)+'">O</text>';
  return s;
}
/* 空間の矢印。from,to は [x,y,z]。ラベルは線に垂直14pxずらし＋白フチ。 */
function arrow3D(idp, color, from, to, label, side){
  var p1 = proj(from[0],from[1],from[2]), p2 = proj(to[0],to[1],to[2]);
  var x1=p1[0],y1=p1[1],x2=p2[0],y2=p2[1];
  var s = '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+SVG_COLORS[color]+'" stroke-width="2.8" stroke-linecap="round" marker-end="url(#'+idp+'-'+color+')"/>';
  if (label){
    var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy)||1;
    var px=-dy/L, py=dx/L;
    if (px>0){ px=-px; py=-py; }
    if (side === -1){ px=-px; py=-py; }
    var lx=(x1+x2)/2+px*18, ly=(y1+y2)/2+py*18+5;
    s += '<text class="vlabel '+color+'" x="'+lx+'" y="'+ly+'" text-anchor="middle">'+label+'</text>';
  }
  return s;
}
/* 点(x,y,z)への分解（O→x方向→y方向→z方向）を点線で示す */
function decompLines(x,y,z){
  var o=proj(0,0,0), a=proj(x,0,0), b=proj(x,y,0), c=proj(x,y,z);
  var s='';
  s+='<line class="depth-line" x1="'+o[0]+'" y1="'+o[1]+'" x2="'+a[0]+'" y2="'+a[1]+'"/>';
  s+='<line class="depth-line" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"/>';
  s+='<line class="depth-line" x1="'+b[0]+'" y1="'+b[1]+'" x2="'+c[0]+'" y2="'+c[1]+'"/>';
  s+='<text class="depth-label" x="'+((o[0]+a[0])/2-16)+'" y="'+((o[1]+a[1])/2+4)+'">x='+x+'</text>';
  s+='<text class="depth-label" x="'+((a[0]+b[0])/2)+'" y="'+((a[1]+b[1])/2+16)+'" text-anchor="middle">y='+y+'</text>';
  s+='<text class="depth-label" x="'+((b[0]+c[0])/2+9)+'" y="'+((b[1]+c[1])/2+4)+'">z='+z+'</text>';
  return s;
}
/* 点を打つ。dir でラベルを出す向きを選べる（矢印と重ならない側へ逃がすため）。
   'rt'=右上（既定）／'lb'=左下／'lt'=左上／'rb'=右下 */
function pointDot(x,y,z,label,dir,color){
  var p=proj(x,y,z);
  var c = color || 'blue';
  var s='<circle class="pt-dot'+(c==='green'?' green':'')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="4"/>';
  if(label){
    var ox=14, oy=-10, anchor='start';
    if(dir==='lb'){ ox=-13; oy=16; anchor='end'; }
    else if(dir==='lt'){ ox=-13; oy=-9; anchor='end'; }
    else if(dir==='rb'){ ox=14; oy=17; anchor='start'; }
    s+='<text class="vlabel '+c+'" x="'+(p[0]+ox)+'" y="'+(p[1]+oy)+'" text-anchor="'+anchor+'">'+label+'</text>';
  }
  return s;
}
function buildSvg3D(idp, inner){
  var s='<div class="vec-svg-wrap"><svg class="vec-svg" viewBox="0 0 '+SVG_W+' '+SVG_H+'" role="img">';
  s+='<defs>'+svgMarkers(idp)+'</defs>';
  s+=draw3DAxes(idp);
  s+=inner;
  s+='</svg></div>';
  return s;
}
function vecLegend(items){
  var s='<div class="vec-legend">';
  items.forEach(function(it){ s+='<span class="lg '+it.c+'"><span class="swatch" style="border-color:'+SVG_COLORS[it.c]+'"></span>'+it.t+'</span>'; });
  s+='</div>';
  return s;
}
/* ---- ステージ1：空間の点を座標で見る ---- */
function renderStage1(){
  var html='';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title">空間の点は3つの数で表す</h2>';
  html+='  <p class="stage-goal">平面では点を (x, y) の2つの数で表しました。空間では、そこに「奥行き z」を足して (x, y, z) の3つの数で表します。</p>';
  html+='  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  html+='  <p class="lead">下の図は、点 A(2, 3, 2) です。原点 O から、まず手前 x に2、次に右 y に3、最後に上 z に2だけ進んだ場所にあります。灰色の細い線が座標軸、青い矢印が OA↑ です。</p>';
  var inner = decompLines(2,3,2) + arrow3D('s1','blue',[0,0,0],[2,3,2],'')
            + pointDot(2,3,2,'A','rt','blue');
  html+=buildSvg3D('s1', inner);
  html+=vecLegend([{c:'gray',t:'x・y・z 軸（細い灰色）'},{c:'blue',t:'点 A(2, 3, 2) と OA↑'}]);
  html+='  <p class="lead">矢印 OA↑ の大きさ（長さ）は、平面の √(x²+y²) に z² を足して、|a|=√(x²+y²+z²) で求めます。</p>';
  html+='</div>';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
  html+=renderQuizBlock(s1QuizPool(), state.s1.quiz, 's1-quiz-answer', 's1-quiz-next');
  html+='</div>';
  return html;
}
function handleS1QuizAnswer(val){ handleQuizAnswer(state.s1, s1QuizPool(), val); }
function handleS1QuizRetry(){ handleQuizRetry(state.s1); }
function handleS1QuizReveal(){ handleQuizReveal(state.s1); }
function handleS1QuizNext(){ handleQuizNext(state.s1, s1QuizPool()); }
/* ---- ステージ2：奥行きを足す／戻すを何度でも繰り返せる（中心発問） ----
   ボタンを押す前：平面ベクトル（緑）だけを表示
   ボタンを押した後：空間ベクトル（青）だけを表示
   どちらの状態でも矢印は1本だけにして、図をすっきり保つ。 */
function renderStage2(){
  var s=state.s2;
  var html='';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title">平面から空間へ：何が変わる？</h2>';
  html+='  <p class="stage-goal">平面の点 (x, y) に奥行きを加えると、空間の点になります。何がどう増えるのかを、足したり戻したりして見比べます。</p>';
  html+='  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  if(!s.addZShown){
    /* 平面上（z=0）：緑の矢印で平面ベクトル OP↑ を描く */
    var inner0 = decompLines(4,3,0)
               + arrow3D('s2a','green',[0,0,0],[4,3,0],'OP↑')
               + pointDot(4,3,0,'P','rb','green');
    html+=buildSvg3D('s2a', inner0);
    html+=vecLegend([{c:'gray',t:'x・y・z 軸'},{c:'green',t:'平面ベクトル OP↑（高さなし／z=0）'}]);
    html+='  <p class="lead">これは平面の点 P(4, 3) と、そこへ向かう緑の矢印 OP↑ です。まだ高さ（奥行き z）はなく、床の上に乗っている状態です。ここに z を足すと、どうなるでしょうか。</p>';
  } else {
    /* 高さを足した状態（z=2）：青の矢印で空間ベクトル OP′↑ だけを描く */
    var inner1 = decompLines(4,3,2)
               + arrow3D('s2b','blue',[0,0,0],[4,3,2],'OP′↑')
               + pointDot(4,3,2,'P′','rt','blue');
    html+=buildSvg3D('s2b', inner1);
    html+=vecLegend([{c:'gray',t:'x・y・z 軸'},{c:'blue',t:'空間ベクトル OP′↑（高さ z=2）'}]);
    html+='  <p class="lead">z を2だけ足すと、点は床から上へ持ち上がって P′(4, 3, 2) になりました。点線の x=4・y=3 は変わらず、増えたのは「z の1つ」だけです。ボタンで戻すと、どこが動いたかもう一度確かめられます。</p>';
  }
  /* 切り替えボタン（何度でも往復できる） */
  html+='  <div class="btn-row">';
  html+='<button class="btn primary" data-action="s2-toggle-z">'
      + (s.addZShown ? '奥行き z を戻す（z=0 にする）' : '奥行き z を足してみる') + '</button>';
  html+='  </div>';
  html+='  <div class="toggle-state"><span class="now">今の状態：'
      + (s.addZShown ? '空間ベクトル（z=2）' : '平面ベクトル（z=0）') + '</span>'
      + '<span>切り替えた回数：'+s.zCount+' 回</span>'
      + '<span>何度でも切り替えて、どこが動くか見比べられます。</span></div>';
  if(s.zEverShown){
    html+='  <p class="lead" style="margin-top:14px;">Q. 空間ベクトルを成分で表すと、いくつの数の組になりますか。</p>';
    html+='  <div class="btn-row">';
    (function(){
      var locked=mcDone(s,'mc',S2_MC_CORRECT);
      S2_MC_OPTIONS.forEach(function(opt){
        var cls='btn';
        if(locked){ if(opt===S2_MC_CORRECT) cls+=' correct-ans'; else if(opt===s.mcSelected) cls+=' selected'; }
        else if(s.mcAnswered && opt===s.mcSelected){ cls+=' selected'; }
        html+='<button class="'+cls+'" data-action="s2-mc-answer" data-value="'+escAttr(opt)+'" '+(s.mcAnswered?'disabled':'')+'>'+opt+'</button>';
      });
    })();
    html+='  </div>';
    html+=mcFeedback(s,'mc',S2_MC_CORRECT,
      ['平面の (x, y) は2つでした。奥行き z を1つ足すと、いくつになりますか。',
       '2つに1つ足すので3つです。(x, y, z) の3つの組になります。'],
      '平面の (x, y) に奥行き z を足すので、空間ベクトルは3つの数の組 (a₁, a₂, a₃) で表します。増えたのは z の1つだけです。','s2-mc');
  }
  html+='</div>';
  if(s.zEverShown && mcDone(s,'mc',S2_MC_CORRECT)){
    html+='<div class="panel">';
    html+='  <h2 class="stage-title" style="font-size:1.05em;">平面と空間の対応</h2>';
    html+='  <p class="lead">空間になっても、ベクトルが「向きと大きさを持つ矢印」であることは変わりません。変わるのは成分の個数だけです。</p>';
    html+='<div class="fix-change">';
    html+='  <div class="fc-box fixed"><span class="fc-label">変わらないもの</span><div class="fc-val">矢印・向き・大きさ</div></div>';
    html+='  <div class="fc-box change"><span class="fc-label">増えるもの</span><div class="fc-val">奥行き z の成分</div></div>';
    html+='  <div class="fc-box result"><span class="fc-label">結果</span><div class="fc-val">成分が (x, y, z) の3つ</div></div>';
    html+='</div>';
    html+='<table class="terms"><tr><th></th><th>平面ベクトル</th><th>空間ベクトル</th></tr>';
    html+='<tr><td>成分</td><td>(a₁, a₂)</td><td class="hl">(a₁, a₂, a₃)</td></tr>';
    html+='<tr><td>大きさ</td><td>√(a₁²+a₂²)</td><td class="hl">√(a₁²+a₂²+a₃²)</td></tr>';
    html+='</table>';
    html+='</div>';
    html+='<div class="panel">';
    html+='  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
    html+=renderQuizBlock(s2QuizPool(), state.s2.quiz, 's2-quiz-answer', 's2-quiz-next');
    html+='</div>';
  }
  return html;
}
function handleS2ToggleZ(){
  var s = state.s2;
  s.addZShown = !s.addZShown;
  s.zCount = s.zCount + 1;
  if (s.addZShown) s.zEverShown = true;
  render();
}
function handleS2McAnswer(val){ mcAnswer(state.s2,'mc',S2_MC_CORRECT,val); render(); }
function handleS2McRetry(){ mcRetry(state.s2,'mc'); render(); }
function handleS2McReveal(){ mcReveal(state.s2,'mc'); render(); }
function handleS2QuizAnswer(val){ handleQuizAnswer(state.s2, s2QuizPool(), val); }
function handleS2QuizRetry(){ handleQuizRetry(state.s2); }
function handleS2QuizReveal(){ handleQuizReveal(state.s2); }
function handleS2QuizNext(){ handleQuizNext(state.s2, s2QuizPool()); }
/* ---- ステージ3：成分の計算と大きさ ---- */
function renderStage3(){
  var html='';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title">成分で計算しよう</h2>';
  html+='  <p class="stage-goal">空間ベクトルの和・差・実数倍・大きさは、平面と同じルールで、対応する成分どうしを計算します。z成分も同じように扱います。</p>';
  html+='  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  html+='  <div class="flow-vert">';
  html+='    <div class="flow-row"><div class="step-box"><div class="step-label">和</div><span class="math-lg">(a₁+b₁, a₂+b₂, a₃+b₃)</span></div></div>';
  html+='    <div class="flow-row"><div class="step-box"><div class="step-label">実数倍</div><span class="math-lg">k(a₁, a₂, a₃)=(ka₁, ka₂, ka₃)</span></div></div>';
  html+='    <div class="flow-row"><div class="step-box"><div class="step-label">大きさ</div><span class="math-lg">|a|=√(a₁²+a₂²+a₃²)</span></div></div>';
  html+='  </div>';
  html+='  <p class="small-note">どれも平面のときの式に、z成分（3つ目）を同じように加えただけです。新しく覚えることはほとんどありません。</p>';
  html+='</div>';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
  html+=renderQuizBlock(s3QuizPool(), state.s3.quiz, 's3-quiz-answer', 's3-quiz-next');
  html+='</div>';
  return html;
}
function handleS3QuizAnswer(val){ handleQuizAnswer(state.s3, s3QuizPool(), val); }
function handleS3QuizRetry(){ handleQuizRetry(state.s3); }
function handleS3QuizReveal(){ handleQuizReveal(state.s3); }
function handleS3QuizNext(){ handleQuizNext(state.s3, s3QuizPool()); }
/* ---- ステージ4：2点からベクトルを作る（反例） ----
   始点 A のラベルは矢印の進む向き（右上）と反対の左下へ逃がし、
   緑の矢印と重ならないようにする。 */
function renderStage4(){
  var html='';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title">2点からベクトルを作ろう</h2>';
  html+='  <p class="stage-goal">空間の2点 A、B から AB↑ を作ります。平面と同じく「終点 − 始点」で、各成分ごとに引きます。</p>';
  html+='  <div class="flow-badge">'+flowBadgeInner()+'</div>';
  var inner = pointDot(1,1,1,'A','lb','blue')
            + pointDot(3,4,3,'B','rt','blue')
            + arrow3D('s4','green',[1,1,1],[3,4,3],'AB↑');
  html+=buildSvg3D('s4', inner);
  html+=vecLegend([{c:'gray',t:'x・y・z 軸'},{c:'blue',t:'点 A（始点）・点 B（終点）'},{c:'green',t:'AB↑（A から B へ）'}]);
  html+='  <p class="lead">AB↑＝(B の座標)−(A の座標) を、x・y・z の成分ごとに引きます。<b>引く順番を逆にすると向きが逆（BA↑）になり、符号がすべて反対</b>になります。ここが間違えやすいところです。</p>';
  html+='  <p class="small-note">また、z が同じ値でも z成分は消えず 0 として残ります。空間では成分を必ず3つ書きましょう（z を忘れるのが典型的な誤りです）。</p>';
  html+='</div>';
  html+='<div class="panel">';
  html+='  <h2 class="stage-title" style="font-size:1.05em;">確認問題</h2>';
  html+=renderQuizBlock(s4QuizPool(), state.s4.quiz, 's4-quiz-answer', 's4-quiz-next');
  html+='</div>';
  return html;
}
function handleS4QuizAnswer(val){ handleQuizAnswer(state.s4, s4QuizPool(), val); }
function handleS4QuizRetry(){ handleQuizRetry(state.s4); }
function handleS4QuizReveal(){ handleQuizReveal(state.s4); }
function handleS4QuizNext(){ handleQuizNext(state.s4, s4QuizPool()); }
function stepGateMessage(){
  var key=STEPS[state.stepIndex];
  if(key==='s2' && !(state.s2.zEverShown && mcDone(state.s2,'mc',S2_MC_CORRECT))){
    return 'このステージには、まだ確認していない内容があります。先に現在の問題を進めましょう。';
  }
  return null;
}
var RENDERERS = {
  s1: renderStage1,
  s2: renderStage2,
  s3: renderStage3,
  s4: renderStage4,
  summary: renderSummary
};
function handleAction(action, value, el){
  switch(action){
    case 'next': goNext(); break;
    case 'prev': goPrev(); break;
    case 'restart': restartAll(); break;
    case 'complete': handleComplete(); break;
    case 's1-quiz-answer': handleS1QuizAnswer(value); break;
    case 's1-quiz-retry': handleS1QuizRetry(); break;
    case 's1-quiz-reveal': handleS1QuizReveal(); break;
    case 's1-quiz-next': handleS1QuizNext(); break;
    case 's2-toggle-z': handleS2ToggleZ(); break;
    case 's2-mc-answer': handleS2McAnswer(value); break;
    case 's2-mc-retry': handleS2McRetry(); break;
    case 's2-mc-reveal': handleS2McReveal(); break;
    case 's2-quiz-answer': handleS2QuizAnswer(value); break;
    case 's2-quiz-retry': handleS2QuizRetry(); break;
    case 's2-quiz-reveal': handleS2QuizReveal(); break;
    case 's2-quiz-next': handleS2QuizNext(); break;
    case 's3-quiz-answer': handleS3QuizAnswer(value); break;
    case 's3-quiz-retry': handleS3QuizRetry(); break;
    case 's3-quiz-reveal': handleS3QuizReveal(); break;
    case 's3-quiz-next': handleS3QuizNext(); break;
    case 's4-quiz-answer': handleS4QuizAnswer(value); break;
    case 's4-quiz-retry': handleS4QuizRetry(); break;
    case 's4-quiz-reveal': handleS4QuizReveal(); break;
    case 's4-quiz-next': handleS4QuizNext(); break;
    case 'summary-reveal': handleSummaryReveal(value); break;
    case 'summary-check': handleSummaryCheck(value); break;
  }
}
/* =========================================================================
   LESSON-SPECIFIC-RENDERERS-END
   ========================================================================= */
/* ---------- 初期表示 ---------- */
render();
</script>
